[defaults]
force_color = True
inventory = hosts
roles_path = .bay/vendor/roles:.bay/roles
# `collections_path`, NOT `collections_paths` — ansible-core 2.20 silently
# ignores the plural spelling and falls back to ~/.ansible/collections, which
# bypasses the pinned collections `bin/bay install` vendors.
collections_path = .bay/vendor/collections
vault_password_file = .vault_pass

[ssh_connection]
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
retries = 1
