---
# Vault-encrypted secrets for production
# Encrypt with: ansible-vault encrypt group_vars/production/secrets.yml
#
# Secret names referenced by services.yml env.secret entries
# are looked up here at template time.

secrets:
  # Service secrets. `env.secret` list entries are looked up with the
  # service name as prefix: status-page + DB_PASSWORD -> STATUS_PAGE_DB_PASSWORD.
  STATUS_PAGE_DB_PASSWORD: ""
  STATUS_PAGE_SESSION_SECRET: ""
  MYAPP_SESSION_SECRET: ""

  # Referenced directly as {{ secrets.DB_PASSWORD }} by myapp's DATABASE_URL
  DB_PASSWORD: ""

  # postgres accessory (dict form -> no prefix)
  POSTGRES_PASSWORD: ""

  # Telegram alerts
  TELEGRAM_BOT_TOKEN: ""

  # Backup credentials (see docs/backups.md)
  # backup_s3_endpoint: "s3.eu-central-1.amazonaws.com"
  # backup_s3_bucket: "my-backup-bucket"
  # backup_s3_access_key_id: "AKIA..."
  # backup_s3_secret_access_key: ""
  # backup_restic_password: ""  # generate with: bin/bay secret
