---
# Staging-specific configuration
# Builds happen locally on the staging server

# Build strategy: local builds on this server
git_deploy_build_strategy: local
git_deploy_build_mem_limit: "2g"

# Alerts are configured in group_vars/all/alerts.yml — see `bin/bay alerts`
# and docs/alerting.md. Do not add alert sinks here: env-level group_vars
# outrank group_vars/all, so they would silently override that file.
