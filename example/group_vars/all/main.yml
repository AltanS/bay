---
# Core project configuration
# Values here apply to all environments

# Default SSH user for provisioned servers (override with -u root for first run)
ansible_user: bay-admin

admin_user: bay-admin
app_user: bay
app_user_group: bay

apt_cache_valid_time: 3600
apt_package_state: present

docker_users:
  - "{{ admin_user }}"
  - "{{ app_user }}"

# Docker daemon configuration (written to /etc/docker/daemon.json by geerlingguy.docker)
docker_daemon_options:
  log-driver: json-file
  log-opts:
    max-size: "50m"
    max-file: "3"

# Ensure Compose V2 plugin is installed
docker_install_compose_plugin: true
docker_compose_package: docker-compose-plugin
docker_compose_package_state: present

# Project identity
stack_name: bay
stack_dir: "/opt/{{ stack_name }}"
docker_compose_file: "{{ stack_dir }}/docker-compose.yml"

# Backups (disabled by default — enable when S3 credentials are configured)
# See docs/backups.md for setup instructions
# backup_enabled: true

# Minimum framework version required by this consumer (optional)
# Deploys will fail fast if .bay/ has an older version than this
# bay_minimum_version: "0.1.0"

# Build strategy configuration (optional — uncomment to override defaults)
# Defaults: local builds on each server, 2GB memory cap
# For dedicated build servers, use strategy: remote and set git_deploy_build_host
# git_deploy_build_strategy: local
# git_deploy_build_mem_limit: "2g"
# git_deploy_build_host: ""

# Per-container log rotation defaults (applied to every compose container unless
# a per-service `log_rotation` override is set in services.yml). Each service can
# override individual keys with `log_rotation: {max_size: "200m", max_file: 10}`,
# or opt out entirely with `log_rotation: false` (falls back to daemon log-opts).
# log_rotation_defaults:
#   driver: json-file
#   max_size: "50m"
#   max_file: 3
