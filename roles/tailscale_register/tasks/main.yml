---
# Tailscale register — connect VPS to Headscale
# Runs AFTER container_lifecycle so the headscale container is available.
# Idempotent: skips registration if tailscale is already connected.
#
# Breaking change: headscale_server_user now defaults to stack_name
# instead of "server". Existing deployments with nodes registered under user
# "server" should run `bay gateway migrate-namespace` to rename the old
# user. Re-deploying without migrating creates a new user (stack_name) but the
# VPS node stays connected under "server" until its next registration.

# -- Status Check ---------------------------------------------------------------

- name: Check tailscale status
  ansible.builtin.command: tailscale status --json
  register: tailscale_status_result
  changed_when: false
  failed_when: false
  become: true
  become_user: root
  tags: [tailscale_register]

# -- Determine registration need ------------------------------------------------

# In --check mode the status command above is SKIPPED, so `stdout` is empty and
# `from_json` raises — the play dies with exit 2. Guarded with `is not skipped`.
# Deliberately NOT `rc is defined`: a command task skipped by check mode still
# registers rc 0, so that guard passes and the crash happens anyway.
#
# When the fact is not set, every task below falls back to
# `_needs_registration | default(false)` — the role must never register a node
# in a dry run, and it cannot know whether registration is needed without the
# status probe.
- name: Set registration needed fact
  ansible.builtin.set_fact:
    _needs_registration: >-
      {{ tailscale_status_result.rc != 0 or
         ('BackendState' in (tailscale_status_result.stdout | from_json) and
          (tailscale_status_result.stdout | from_json).BackendState != 'Running') }}
  when: tailscale_status_result is not skipped
  tags: [tailscale_register]

# == Local path (control region — headscale_server is true) ====================
# Uses `docker exec` on the co-located headscale container.

- name: Wait for headscale container to be running
  ansible.builtin.command: docker inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' headscale
  register: headscale_container_status
  until: headscale_container_status.stdout | trim == 'running'
  retries: 12
  delay: 5
  changed_when: false
  become: true
  become_user: root
  when: (_needs_registration | default(false)) and (headscale_server | default(true) | bool)
  tags: [tailscale_register]

- name: Create headscale server user
  ansible.builtin.command: >-
    docker exec headscale headscale users create {{ headscale_server_user }}
  register: headscale_user_result
  changed_when: "'Created' in headscale_user_result.stdout"
  failed_when: >-
    headscale_user_result.rc != 0 and
    'already exists' not in headscale_user_result.stderr and
    'UNIQUE constraint failed' not in headscale_user_result.stderr
  when: (_needs_registration | default(false)) and (headscale_server | default(true) | bool)
  tags: [tailscale_register]

- name: Get server user ID
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail &&
      docker exec headscale headscale users list -o json |
      python3 -c "import sys,json; users=json.load(sys.stdin);
      print(next(u['id'] for u in users if u['name'] == '{{ headscale_server_user }}'))"
    executable: /bin/bash
  register: headscale_user_id_result
  changed_when: false
  when: (_needs_registration | default(false)) and (headscale_server | default(true) | bool)
  tags: [tailscale_register]

- name: Generate pre-auth key
  ansible.builtin.command: >-
    docker exec headscale headscale preauthkeys create
    --user {{ headscale_user_id_result.stdout | trim }} --expiration 5m
  register: headscale_preauth_result
  no_log: true
  when: (_needs_registration | default(false)) and (headscale_server | default(true) | bool)
  tags: [tailscale_register]

- name: Connect tailscale to headscale
  ansible.builtin.command: >-
    tailscale up
    --login-server=https://{{ headscale_domain }}
    --authkey={{ headscale_preauth_result.stdout | trim }}
    --hostname={{ headscale_node_hostname }}
  become: true
  become_user: root
  no_log: true
  when: (_needs_registration | default(false)) and (headscale_server | default(true) | bool)
  tags: [tailscale_register]

# == Remote path (non-control region — headscale_server is false) ==============
# Default since 2.19.0: run the headscale CLI on the control host. The task is
# delegated to that host over SSH and runs `docker exec headscale headscale ...`
# there, like the local path above. No API key, and no call to the admin REST
# API, which Traefik closes to the internet by default
# (headscale_admin_api_public: false).
#
# The control host is the first host of the inventory group named by
# headscale_control_region, the convention deploy.yml's link resolution uses
# (`groups[region] | first`). It is an inventory lookup on purpose: role
# defaults and play vars do not cross into hostvars of another host.
#
# Limit: the deploy machine needs SSH and sudo on the control host, the access
# it already uses to deploy that host. A machine without it sets
# headscale_register_via_api: true (see the API path below).

- name: Resolve the headscale control host
  ansible.builtin.set_fact:
    _headscale_control_host: >-
      {{ groups[headscale_control_region | default('')] | default([]) | first | default('') }}
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Fail if the control host is not in the inventory
  ansible.builtin.fail:
    msg: >-
      This box joins the tailnet through the Headscale control host, but the
      inventory has no host in the group '{{ headscale_control_region | default('') }}'
      (headscale_control_region). Add the control box to that group in
      hosts/<env> and deploy again. If this deploy machine cannot reach the
      control box over SSH, set headscale_register_via_api: true and
      headscale_admin_api_public: true in group_vars/all, store
      headscale_api_key in the vault, and deploy the control region first.
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
    - (_headscale_control_host | default('') | length) == 0
  tags: [tailscale_register]

- name: Check SSH access to the control host
  ansible.builtin.ping:
  delegate_to: "{{ _headscale_control_host | default(inventory_hostname, true) }}"
  become: false
  register: _headscale_control_ping
  ignore_unreachable: true
  failed_when: false
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Fail if the control host is not reachable
  ansible.builtin.fail:
    msg: >-
      This box joins the tailnet through the Headscale control host
      {{ _headscale_control_host }}, and this deploy machine cannot reach it
      over SSH ({{ _headscale_control_ping.msg | default('no reply') }}).
      Fix SSH access to {{ _headscale_control_host }} (the same access a deploy
      of that box uses) and deploy again. If this machine must not reach it,
      set headscale_register_via_api: true and headscale_admin_api_public: true
      in group_vars/all and store headscale_api_key in the vault.
  when:
    - _headscale_control_ping is not skipped
    - (_headscale_control_ping.unreachable | default(false)) or (_headscale_control_ping.ping | default('')) != 'pong'
  tags: [tailscale_register]

- name: Check the headscale container on the control host
  ansible.builtin.command: docker inspect --format '{{ '{{' }}.State.Status{{ '}}' }}' headscale
  delegate_to: "{{ _headscale_control_host | default(inventory_hostname, true) }}"
  become: true
  become_user: root
  register: _headscale_control_container
  changed_when: false
  failed_when: false
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Fail if headscale is not running on the control host
  ansible.builtin.fail:
    msg: >-
      Headscale is not running on the control host {{ _headscale_control_host }}.
      Deploy the control region first, then this box.
  when:
    - _headscale_control_container is not skipped
    - (_headscale_control_container.stdout | default('') | trim) != 'running'
  tags: [tailscale_register]

- name: Create headscale user (control host)
  ansible.builtin.command: >-
    docker exec headscale headscale users create {{ headscale_server_user }}
  delegate_to: "{{ _headscale_control_host | default(inventory_hostname, true) }}"
  become: true
  become_user: root
  register: _headscale_control_user_create
  changed_when: _headscale_control_user_create.rc == 0
  failed_when: >-
    _headscale_control_user_create.rc != 0 and
    'already exists' not in _headscale_control_user_create.stderr and
    'UNIQUE constraint failed' not in _headscale_control_user_create.stderr
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: List headscale users (control host)
  ansible.builtin.command: docker exec headscale headscale users list -o json
  delegate_to: "{{ _headscale_control_host | default(inventory_hostname, true) }}"
  become: true
  become_user: root
  register: _headscale_control_users
  changed_when: false
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

# Guarded with `is not skipped`: a command task skipped by check mode still
# registers rc 0 with an empty stdout, and `from_json` of that fails.
- name: Extract server user ID (control host)
  ansible.builtin.set_fact:
    _headscale_user_id: >-
      {{ (_headscale_control_users.stdout | from_json
          | selectattr('name', 'equalto', headscale_server_user)
          | first).id }}
  when:
    - _headscale_control_users is not skipped
    - (_headscale_control_users.stdout | default('') | trim | length) > 0
  tags: [tailscale_register]

- name: Generate pre-auth key (control host)
  ansible.builtin.command: >-
    docker exec headscale headscale preauthkeys create
    --user {{ _headscale_user_id | int }} --expiration 5m -o json
  delegate_to: "{{ _headscale_control_host | default(inventory_hostname, true) }}"
  become: true
  become_user: root
  register: _headscale_control_preauth
  no_log: true
  when:
    - _needs_registration | default(false)
    - not (headscale_server | default(true) | bool)
    - not (headscale_register_via_api | default(false) | bool)
    - _headscale_user_id is defined
  tags: [tailscale_register]

- name: Connect tailscale to headscale (control host path)
  ansible.builtin.command: >-
    tailscale up
    --login-server=https://{{ headscale_domain }}
    --authkey={{ (_headscale_control_preauth.stdout | from_json).key }}
    --accept-routes
    --hostname={{ headscale_node_hostname }}
  become: true
  become_user: root
  no_log: true
  when:
    - _headscale_control_preauth is defined
    - _headscale_control_preauth is not skipped
    - (_headscale_control_preauth.stdout | default('') | trim | length) > 0
  tags: [tailscale_register]

# == API path (opt-in: headscale_register_via_api: true) =======================
# Calls the Headscale admin REST API on headscale_domain with a bearer key.
# Only for a deploy machine that cannot reach the control host over SSH. It
# needs headscale_admin_api_public: true (or this box's public IP in
# headscale_admin_api_allowed_ips): the admin API is closed by default, and a
# box that is not yet on the tailnet calls it from its public IP.

- name: Fail if no API key for remote registration
  ansible.builtin.fail:
    msg: >-
      headscale_register_via_api is true, so headscale_api_key is required in
      the secrets dict. Generate one with: bay gateway apikey. Or set
      headscale_register_via_api: false to register through the control host
      over SSH (the default, no key needed).
  when: >-
    (_needs_registration | default(false)) and
    not (headscale_server | default(true) | bool) and
    (headscale_register_via_api | default(false) | bool) and
    (secrets.headscale_api_key is not defined or secrets.headscale_api_key | length == 0)
  tags: [tailscale_register]

- name: Create headscale user (API)
  ansible.builtin.uri:
    url: "https://{{ headscale_domain }}/api/v1/user"
    method: POST
    headers:
      Authorization: "Bearer {{ secrets.headscale_api_key }}"
    body_format: json
    body:
      name: "{{ headscale_server_user }}"
    status_code: [200, 403, 409, 500]
  register: _create_user_result
  no_log: true
  when: >-
    (_needs_registration | default(false)) and
    not (headscale_server | default(true) | bool) and
    (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Fail if the admin API is closed to this box
  ansible.builtin.fail:
    msg: >-
      Traefik refused the Headscale admin API (HTTP 403): it is closed to the
      internet (headscale_admin_api_public is false). Set
      headscale_admin_api_public: true in group_vars/all and run
      `bay deploy <env> --tags headscale`, or
      set headscale_register_via_api: false to register through the control
      host over SSH.
  when:
    - _create_user_result is not skipped
    - _create_user_result.status | default(0) == 403
  tags: [tailscale_register]

- name: Fail if user creation returned unexpected error
  ansible.builtin.fail:
    msg: "Failed to create headscale user: {{ _create_user_result.json.message | default(_create_user_result.msg) }}"
  when:
    - _create_user_result is not skipped
    - _create_user_result.status | default(0) == 500
    - "'UNIQUE constraint' not in (_create_user_result.json.message | default(''))"
  tags: [tailscale_register]

- name: Look up server user ID (API)
  ansible.builtin.uri:
    url: "https://{{ headscale_domain }}/api/v1/user"
    method: GET
    headers:
      Authorization: "Bearer {{ secrets.headscale_api_key }}"
    status_code: [200]
  register: _user_list_result
  no_log: true
  when: >-
    (_needs_registration | default(false)) and
    not (headscale_server | default(true) | bool) and
    (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Extract server user ID (API)
  ansible.builtin.set_fact:
    _headscale_user_id: >-
      {{ (_user_list_result.json.users
          | selectattr('name', 'equalto', headscale_server_user)
          | first).id }}
  when:
    - _user_list_result is not skipped
    - _user_list_result.json is defined
  tags: [tailscale_register]

- name: Generate pre-auth key (API)
  ansible.builtin.uri:
    url: "https://{{ headscale_domain }}/api/v1/preauthkey"
    method: POST
    headers:
      Authorization: "Bearer {{ secrets.headscale_api_key }}"
    body_format: json
    body:
      user: "{{ _headscale_user_id | int }}"
      reusable: false
      ephemeral: false
      expiration: "{{ '%Y-%m-%dT%H:%M:%SZ' | strftime(ansible_facts['date_time']['epoch'] | int + 300) }}"
    status_code: [200]
  register: _headscale_preauthkey_api
  no_log: true
  when: >-
    (_needs_registration | default(false)) and
    not (headscale_server | default(true) | bool) and
    (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

- name: Connect tailscale to headscale (API path)
  ansible.builtin.command: >-
    tailscale up
    --login-server=https://{{ headscale_domain }}
    --authkey={{ _headscale_preauthkey_api.json.preAuthKey.key }}
    --accept-routes
    --hostname={{ headscale_node_hostname }}
  become: true
  become_user: root
  no_log: true
  when: >-
    (_needs_registration | default(false)) and
    not (headscale_server | default(true) | bool) and
    (headscale_register_via_api | default(false) | bool)
  tags: [tailscale_register]

# == After a registration (both paths) =========================================
# `headscale_server_tailnet_ip` is THIS host's own tailnet IP, set per region in
# group_vars (default 100.64.0.1). It is this host's gateway_bind_ip, and the
# control host's config.yaml points the split-DNS record of every VPN service
# at the value of the host that runs it. So a remote box is checked against
# its own value, like the control host. It used to be right on a fresh control host only because
# sequential allocation gave the first node 100.64.0.1. With
# headscale_ip_allocation `random` (the default) a new node gets a random IP,
# so a mismatch would leave VPN services bound to, and resolved to, an address
# this host does not have. Checked only right after this run registered the
# node, so an already-registered host is never stopped by it.

- name: Read this host's tailnet IPv4 after registration
  ansible.builtin.command: tailscale ip -4
  register: _tailscale_ip_after_register
  changed_when: false
  become: true
  become_user: root
  when: _needs_registration | default(false)
  tags: [tailscale_register]

- name: Check headscale_server_tailnet_ip against the registered IP
  ansible.builtin.assert:
    that:
      - (_tailscale_ip_after_register.stdout | trim) == (headscale_server_tailnet_ip | default('100.64.0.1') | string)
    fail_msg: >-
      This host joined the tailnet as {{ _tailscale_ip_after_register.stdout | trim }},
      but headscale_server_tailnet_ip is {{ headscale_server_tailnet_ip | default('100.64.0.1') }}.
      Set headscale_server_tailnet_ip: "{{ _tailscale_ip_after_register.stdout | trim }}"
      in group_vars for this host, then deploy again. Split DNS and the VPN bind
      address use that value.
    quiet: true
  when:
    - _needs_registration | default(false)
    - _tailscale_ip_after_register is not skipped
  tags: [tailscale_register]
