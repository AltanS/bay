---
# Install restic binary from GitHub releases
# Requires root privileges since /usr/local/bin is root-owned

- name: Check if restic is already installed
  ansible.builtin.stat:
    path: "{{ backup_restic_bin }}"
  register: _restic_bin_stat
  become: true
  become_user: root

- name: Download and install restic {{ backup_restic_version }}
  become: true
  become_user: root
  when: not _restic_bin_stat.stat.exists
  block:
    - name: Download restic binary archive
      ansible.builtin.get_url:
        url: "https://github.com/restic/restic/releases/download/v{{ backup_restic_version }}/restic_{{ backup_restic_version }}_linux_amd64.bz2"
        dest: "/tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
        # Fails closed on a tampered or mismatched artefact. Bumping
        # backup_restic_version without backup_restic_checksum stops here.
        checksum: "sha256:{{ backup_restic_checksum }}"
        mode: "0644"

    - name: Decompress and install restic binary
      ansible.builtin.shell:
        cmd: "bunzip2 -c /tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2 > {{ backup_restic_bin }}"
        creates: "{{ backup_restic_bin }}"

    - name: Set restic binary permissions
      ansible.builtin.file:
        path: "{{ backup_restic_bin }}"
        owner: root
        group: root
        mode: "0755"

    - name: Clean up downloaded archive
      ansible.builtin.file:
        path: "/tmp/restic_{{ backup_restic_version }}_linux_amd64.bz2"
        state: absent

- name: Verify restic installation
  ansible.builtin.command:
    cmd: "{{ backup_restic_bin }} version"
  changed_when: false
  register: _restic_version
  become: true
  become_user: root

- name: Display restic version
  ansible.builtin.debug:
    msg: "{{ _restic_version.stdout }}"

# The file method (volume backups, Headscale state) runs `restic backup
# --stdin-from-command`, which restic has since 0.17.0. The download above is
# skipped when a binary is already there, so an older restic on the box would
# stay. Stop here instead of writing scripts that fail on every run.
# Restic 0.19.0 and newer are refused too: 0.19 prints a progress line on stdout
# before the JSON of `restic stats --json`, and the snapshot size check reads
# that JSON with jq, so every backup would fail its size check after the snapshot.
# `is not skipped`: under --check the command above is skipped and its stdout
# is empty, which says nothing about the box.
- name: Require restic 0.17 or 0.18 for the backup scripts
  ansible.builtin.assert:
    that:
      - _restic_found is version('0.17.0', '>=')
      - _restic_found is version('0.19.0', '<')
    fail_msg: >-
      {{ backup_restic_bin }} reports '{{ _restic_version.stdout }}'. The backup
      scripts need restic 0.17.0 or newer (backup --stdin-from-command) and older
      than 0.19.0: restic 0.19 prints a progress line before the JSON of
      'restic stats --json', which breaks the snapshot size check. Remove the
      binary so this role installs {{ backup_restic_version }}, then run the backup tag again.
    quiet: true
  vars:
    _restic_found: "{{ (_restic_version.stdout | default('') | regex_search('restic ([0-9]+\\.[0-9]+\\.[0-9]+)', '\\1') or ['0.0.0']) | first }}"
  when: _restic_version is not skipped
