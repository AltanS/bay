---
# Backup role: installs restic, resolves per-accessory backup config,
# initializes S3 repositories. Runs as app_user with targeted become for root ops.

- name: Install restic binary
  ansible.builtin.include_tasks: install.yml
  when: backup_enabled

- name: Resolve the backup targets of this host
  ansible.builtin.import_tasks: resolve.yml

- name: Install the Headscale snapshot helper (control region only)
  ansible.builtin.include_tasks: headscale.yml
  when: _backup_headscale_enabled | bool

# A root sudoers rule must not outlive the backup that needs it
# (backup_headscale_state switched off, or the host is no longer the control
# region). The helper and its empty folder are harmless and stay.
- name: Remove the Headscale snapshot sudoers rule where it is not used
  ansible.builtin.file:
    path: /etc/sudoers.d/bay-headscale-backup
    state: absent
  become: true
  become_user: root
  when:
    - backup_enabled
    - not (_backup_headscale_enabled | bool)

- name: Discover databases bound to accessories via service database blocks
  ansible.builtin.set_fact:
    _bound_databases: >-
      {{
        _bound_databases | default({}) | combine({
          item.value.database.accessory:
            (_bound_databases | default({}))[item.value.database.accessory] | default([])
            + [item.value.database.name | default(item.key)]
        })
      }}
  loop: "{{ active_services | dict2items | selectattr('value.database', 'defined') | list }}"
  loop_control:
    label: "{{ item.key }} → {{ item.value.database.accessory }}"
  when: backup_enabled

- name: Fail if any accessory has no detectable backup method
  ansible.builtin.fail:
    msg: >-
      Accessory '{{ item.name }}' has backup enabled but no method could be detected
      from image '{{ item.image }}'. Set an explicit method:
      backup: { method: pg_dump|mysql|redis|file }
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - backup_enabled
    - item.method == ''

- name: Display resolved backup accessories
  ansible.builtin.debug:
    msg: "{{ item.name }}: method={{ item.method }}, schedule={{ item.schedule }}, retain={{ item.retain }}"
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: backup_enabled

- name: Ensure backup directories exist
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: "{{ app_user }}"
    group: docker
    mode: "0750"
  loop:
    - "{{ backup_scripts_dir }}"
    - "{{ backup_lock_dir }}"
    - "{{ backup_status_dir }}"
  when: backup_enabled

# Before 2.24.0 `bay backup run` ran the script as root. A first run like that
# left a root-owned restic cache, and the timer (the app user) then ran every
# backup without a cache: more S3 reads, and a "permission denied" in each log.
# Owner only: the files keep their modes.
- name: Give the restic cache back to the app user
  become: true
  become_user: root
  ansible.builtin.file:
    path: "{{ backup_scripts_dir }}/cache"
    state: directory
    owner: "{{ app_user }}"
    group: docker
    recurse: true
  when: backup_enabled

- name: Initialize restic repositories
  ansible.builtin.include_tasks:
    file: init-repos.yml
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  when: backup_enabled

- name: Generate backup scripts for accessories
  ansible.builtin.template:
    src: backup.sh.j2
    dest: "{{ backup_scripts_dir }}/backup-{{ item.name }}.sh"
    owner: "{{ app_user }}"
    group: docker
    mode: "0750"
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    accessory_name: "{{ item.name }}"
    method: "{{ item.method }}"
    retain: "{{ item.retain }}"
    repo: "{{ item.repo }}"
    accessory_config: "{{ item.config }}"
    backup_container: "{{ item.container | default(item.name) }}"
    bound_databases: "{{ (_bound_databases | default({}))[item.name] | default([]) }}"
    pg_format: "{{ item.format | default('plain') }}"
  when: backup_enabled

# A target that left the config (a mount set to backup = false, a removed
# [services.<x>.backup]) keeps its timer, and so its nightly run, until
# something removes it. The role removes only names that its own manifest of
# the last run recorded: a script that some hand or an older release put
# there is never touched. The restic repo stays (docs/backups.md).
- name: Read the manifest of the last backup role run
  ansible.builtin.slurp:
    src: "{{ backup_scripts_dir }}/targets.json"
  register: _backup_old_manifest
  failed_when: false
  check_mode: false
  when: backup_enabled

- name: Find the recorded backup targets that left the config
  ansible.builtin.set_fact:
    _backup_dropped: >-
      {{ (_old_names | difference(_backup_accessories | default([]) | map(attribute='name') | list))
         | select('match', '^[A-Za-z0-9][A-Za-z0-9_.-]*$') | list }}
  vars:
    _old_raw: >-
      {{ (_backup_old_manifest.content | b64decode)
         if (_backup_old_manifest.content | default('')) else '[]' }}
    _old_names: >-
      {{ (_old_raw | from_json | default([], true))
         | selectattr('name', 'defined') | map(attribute='name') | list }}
  when: backup_enabled

- name: Remove the backup units and scripts of targets that left the config
  ansible.builtin.include_tasks: teardown.yml
  vars:
    _teardown_accessories: "{{ _backup_dropped }}"
  when:
    - backup_enabled
    - _backup_dropped | default([]) | length > 0
    - not ansible_check_mode

- name: Report the backup targets that a deploy would remove
  ansible.builtin.debug:
    msg: "Check mode: would remove the backup units and scripts of {{ _backup_dropped | join(', ') }} (the restic repos stay)."
  when:
    - backup_enabled
    - _backup_dropped | default([]) | length > 0
    - ansible_check_mode

# The targets of this host, for the freshness check (bay-backup-freshness)
# and `bay backup status`. Only names and schedules, no secret.
- name: Write the manifest of this host's backup targets
  ansible.builtin.copy:
    dest: "{{ backup_scripts_dir }}/targets.json"
    content: |-
      {%- set out = [] -%}
      {%- for t in _backup_accessories | default([]) -%}
      {%-   set _ = out.append({'name': t.name, 'method': t.method,
                               'format': t.format | default(''),
                               'schedule': t.schedule,
                               'utc': t.utc | default(false) | bool,
                               'max_age_hours': t.max_age_hours | default(backup_max_age_hours) | int}) -%}
      {%- endfor -%}
      {{ out | to_nice_json }}
    owner: "{{ app_user }}"
    group: docker
    mode: "0640"
  when: backup_enabled

- name: Write restic environment file for CLI
  ansible.builtin.template:
    src: restic.env.j2
    dest: "{{ backup_scripts_dir }}/restic.env"
    owner: "{{ app_user }}"
    group: docker
    mode: "0640"
  when: backup_enabled

# ── Systemd Units ──────────────────────────────────────────────────────

- name: Deploy backup service unit
  ansible.builtin.template:
    src: bay-backup@.service.j2
    dest: /etc/systemd/system/bay-backup@.service
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  notify: Reload systemd daemon
  when: backup_enabled

- name: Deploy backup timer units
  ansible.builtin.template:
    src: bay-backup@.timer.j2
    dest: "/etc/systemd/system/bay-backup@{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    accessory_name: "{{ item.name }}"
    timer_schedule: "{{ item.schedule }}"
    timer_utc: "{{ item.utc | default(false) | bool }}"
  become: true
  become_user: root
  notify: Reload systemd daemon
  register: _backup_timer_units
  when: backup_enabled

- name: Flush handlers for systemd reload
  ansible.builtin.meta: flush_handlers

# Check mode writes no unit file, and the systemd module fails on a timer that
# does not exist yet ("Could not find the requested service"). So a check run
# skips the timer whose unit file task reports changed.
- name: Enable and start backup timers
  ansible.builtin.systemd:
    name: "bay-backup@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: root
  when:
    - backup_enabled
    - not (ansible_check_mode and (_backup_timer_units.results | default([]) | selectattr('item.name', 'equalto', item.name) | selectattr('changed') | list | length > 0))

- name: Remove legacy backup cron jobs
  ansible.builtin.cron:
    name: "backup-{{ item.key }}"
    user: "{{ app_user }}"
    state: absent
  loop: "{{ active_accessories | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  when:
    - backup_enabled
    - item.value.backup is defined
  become: true
  become_user: root

# ── Maintenance ──────────────────────────────────────────────────────

- name: Generate maintenance scripts for accessories
  ansible.builtin.template:
    src: maintenance.sh.j2
    dest: "{{ backup_scripts_dir }}/maintenance-{{ item.name }}.sh"
    owner: "{{ app_user }}"
    group: docker
    mode: "0750"
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    accessory_name: "{{ item.name }}"
    repo: "{{ item.repo }}"
  when: backup_enabled

- name: Deploy maintenance service unit
  ansible.builtin.template:
    src: bay-backup-maintenance@.service.j2
    dest: /etc/systemd/system/bay-backup-maintenance@.service
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root
  notify: Reload systemd daemon
  when: backup_enabled

- name: Deploy maintenance timer units
  ansible.builtin.template:
    src: bay-backup-maintenance@.timer.j2
    dest: "/etc/systemd/system/bay-backup-maintenance@{{ item.name }}.timer"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  vars:
    accessory_name: "{{ item.name }}"
  become: true
  become_user: root
  notify: Reload systemd daemon
  register: _backup_maintenance_timer_units
  when: backup_enabled

- name: Flush handlers for maintenance systemd reload
  ansible.builtin.meta: flush_handlers

# Same check-mode rule as the backup timers above.
- name: Enable and start maintenance timers
  ansible.builtin.systemd:
    name: "bay-backup-maintenance@{{ item.name }}.timer"
    enabled: true
    state: started
  loop: "{{ _backup_accessories | default([]) }}"
  loop_control:
    label: "{{ item.name }}"
  become: true
  become_user: root
  when:
    - backup_enabled
    - not (ansible_check_mode and (_backup_maintenance_timer_units.results | default([]) | selectattr('item.name', 'equalto', item.name) | selectattr('changed') | list | length > 0))

# ── Freshness check (2.24.0) ─────────────────────────────────────────────
# Every 6 hours: each target of targets.json must have its script, a running
# timer and a successful run within max_age_hours, else backup.missing or
# backup.stale. Local reads only (see the script header).

- name: Install the backup freshness check script
  ansible.builtin.template:
    src: bay-backup-freshness.sh.j2
    dest: /usr/local/bin/bay-backup-freshness
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: root
  when:
    - backup_enabled
    - backup_freshness_enabled | bool

- name: Install the backup freshness check units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - bay-backup-freshness.service
    - bay-backup-freshness.timer
  become: true
  become_user: root
  register: _backup_freshness_units
  when:
    - backup_enabled
    - backup_freshness_enabled | bool

- name: Reload systemd for the backup freshness check units
  ansible.builtin.systemd:
    daemon_reload: true
  become: true
  become_user: root
  when:
    - backup_enabled
    - backup_freshness_enabled | bool
    - _backup_freshness_units is changed
    - not ansible_check_mode

- name: Enable and start the backup freshness check timer
  ansible.builtin.systemd:
    name: bay-backup-freshness.timer
    enabled: true
    state: started
  become: true
  become_user: root
  when:
    - backup_enabled
    - backup_freshness_enabled | bool
    - not (ansible_check_mode and _backup_freshness_units is changed)

- name: Stop the backup freshness check timer when it is turned off
  ansible.builtin.systemd:
    name: bay-backup-freshness.timer
    enabled: false
    state: stopped
  become: true
  become_user: root
  failed_when: false
  when:
    - backup_enabled
    - not (backup_freshness_enabled | bool)
