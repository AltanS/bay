---
backup_enabled: false
# backup_restic_version and backup_restic_checksum MOVE TOGETHER. The
# checksum is the sha256 of restic_<version>_linux_amd64.bz2 as published in
# the upstream release SHA256SUMS file:
#   https://github.com/restic/restic/releases/download/v0.17.3/SHA256SUMS
# Overriding the version without the checksum fails the download on purpose.
# The backup scripts need 0.17.0 or newer (backup --stdin-from-command; the
# install tasks stop on an older binary) and older than 0.20.0 (tested up to
# 0.19.x). The pin stays 0.17.3: the role installs it only when the binary is
# missing and never upgrades one that is there. CI downloads the version and
# checksum below for the tests that run the real restic.
backup_restic_version: "0.17.3"
backup_restic_checksum: "5097faeda6aa13167aae6e36efdba636637f8741fed89bbf015678334632d4d3"
backup_restic_bin: /usr/local/bin/restic

# S3 backend — reads from secrets dict, falls back to shared S3_* vars
# endpoint example: "s3.eu-central-1.amazonaws.com" (AWS) or "fsn1.your-objectstorage.com" (Hetzner)
backup_s3_endpoint: "{{ secrets.backup_s3_endpoint | default(S3_ENDPOINT | default('')) }}"
backup_s3_bucket: "{{ secrets.backup_s3_bucket | default(S3_BUCKET | default('')) }}"
backup_s3_access_key_id: "{{ secrets.backup_s3_access_key_id | default(S3_ACCESS_KEY_ID | default('')) }}"
backup_s3_secret_access_key: "{{ secrets.backup_s3_secret_access_key | default(S3_SECRET_ACCESS_KEY | default('')) }}"

# Prefix within the bucket (repo path: s3:endpoint/bucket/prefix/hostname/accessory)
backup_s3_prefix: "backups"

# Restic encryption (consumer must set in secrets dict)
backup_restic_password: "{{ secrets.backup_restic_password | default('') }}"

# Default schedule and retention (overridable per-accessory)
backup_schedule: "0 3 * * *"
backup_retain: 30

# Paths
backup_scripts_dir: "{{ stack_dir }}/backup"
backup_lock_dir: "{{ stack_dir }}/backup/locks"

# ── Rig-infrastructure state backups ──────────────────────────────────────
# The accessory loop only covers things declared in services.yml. Headscale is
# rig infrastructure (the tailnet coordination server) whose state is NOT modeled
# as an accessory and was therefore never backed up. That state — the sqlite node
# DB plus the noise + DERP private keys — all lives under the container's
# /var/lib/headscale (bind-mounted from /opt/headscale/data on the host). Losing it
# loses the tailnet identity, every node's IP assignment, and the keys.
#
# The DB runs in WAL mode, so a file copy of the live folder (the old `docker
# cp`) could catch db.sqlite and db.sqlite-wal at different moments. The
# backup script now calls a root helper (backup_headscale_snapshot_bin, through
# one sudoers rule with no arguments) that runs `sqlite3 .backup` on the live DB
# (the SQLite online backup API), checks the copy with `PRAGMA integrity_check`,
# and writes a tar of the copy plus the two private keys to restic. The tar has
# the same `headscale/` layout as before, so the restore is unchanged. The role
# installs the distro `sqlite3` package for it. Gated to the control-region host
# (the only host running the headscale container). The config dir
# (/etc/headscale) is re-rendered on every deploy and is intentionally NOT
# backed up.
backup_headscale_state: true
backup_headscale_container: headscale
backup_headscale_schedule: "{{ backup_schedule }}"
backup_headscale_retain: "{{ backup_retain }}"
# Host side of the container's /var/lib/headscale bind mount.
backup_headscale_data_dir: /opt/headscale/data
# Root helper that makes the snapshot, and its root-only (0700) work folder.
backup_headscale_snapshot_bin: /usr/local/sbin/bay-headscale-db-snapshot
backup_headscale_snapshot_dir: /var/lib/bay-headscale-backup
