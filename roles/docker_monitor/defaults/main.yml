---
# Docker monitor role defaults

docker_monitor_enabled: true
docker_monitor_script_path: /usr/local/bin/docker-monitor.py

# Traefik defaults (must match traefik role — used in logrotate and prometheus templates)
traefik_container_name: traefik
traefik_access_log_path: "{{ stack_dir }}/logs/traefik/access.log"
traefik_metrics_port: 8082

# Telegram transport
docker_monitor_telegram_bot_token: ""
docker_monitor_telegram_chat_id: ""

# Per-alert toggles (all guarded by empty bot token)
docker_monitor_alert_container_crash: true
docker_monitor_alert_restart_loop: true
docker_monitor_alert_healthcheck_failure: true

# Restart loop tuning
docker_monitor_restart_loop_threshold: 3
docker_monitor_restart_loop_window: 300  # seconds
# Minimum seconds between two container.restart_loop alerts for the SAME
# container. A container that keeps looping crosses the threshold again every
# window, and without a cooldown it paged once per window for as long as the
# loop lasted. Persisted in the monitor's state file
# ({{ stack_dir }}/.container-crashes.json), so restarting the monitor does not
# reset it. 0 disables the cooldown. container.health_check_failed keeps its
# own fixed 300 s cooldown.
docker_monitor_restart_loop_cooldown: 1800  # seconds
# Maximum age of a row in the monitor's crash state
# ({{ stack_dir }}/.container-crashes.json). A row is written when a container
# dies and removed when it starts again, so a one-off `docker run` container
# that never starts again used to stay in the file for ever. Rows older than
# this are dropped whenever the file is written and when the monitor starts.
# A row with a missing or unparsable `crashed_at` is dropped too, because its
# age can never be known. A container that stays down longer than this gets no
# container.recovered alert when it finally starts. 0 keeps rows for ever.
docker_monitor_crash_state_max_age: 604800  # seconds (7 days)

# Containers to ignore (list of name patterns)
# Canary containers (-new suffix) are transient and should not trigger alerts
docker_monitor_ignore_containers:
  - "-new"

# Alert message branding
docker_monitor_alert_header: "════════════════\n⛵ <b>BAY</b>\n════════════════\n\n"
docker_monitor_alert_footer: ""
