---
# rename_migration — converge a host provisioned before the pre-1.0 rename
# onto the new artifact names.
#
# EVERY old-name literal in this role is tagged `# kept-argo:` on purpose:
# the role's whole job is to name pre-1.0 artifacts so it can remove them.
# `grep -rn kept-argo roles/rename_migration` is the complete inventory.
# As of v1.4.1 this role is still deployed on every host: deleting it deletes
# the last host-facing reference to the old name, but only once every host
# has actually converged. Removal is deferred to a future major release, not
# v1.1 as earlier notes claimed — see docs/rename-map.md.
#
# The role never globs. Only the unit basenames enumerated below are stopped,
# disabled and deleted — a pre-1.0-prefixed unit a consumer created by hand is
# left alone.

rename_migration_enabled: true

# Pre-1.0 systemd unit basenames rendered by the framework, exactly as they
# appeared in /etc/systemd/system. Template units (`@`) are listed in their
# template form; live instances are discovered at run time and matched back to
# these templates, so an instantiated backup timer is covered without any
# glob deletion.
rename_migration_units:
  - argo-backup@.service  # kept-argo: pre-1.0 unit basename
  - argo-backup@.timer  # kept-argo: pre-1.0 unit basename
  - argo-backup-maintenance@.service  # kept-argo: pre-1.0 unit basename
  - argo-backup-maintenance@.timer  # kept-argo: pre-1.0 unit basename
  - argo-infra-boot.service  # kept-argo: pre-1.0 unit basename
  - argo-build@.path  # kept-argo: pre-1.0 unit basename
  - argo-build@.service  # kept-argo: pre-1.0 unit basename
  - argo-build-alert@.service  # kept-argo: pre-1.0 unit basename
  - argo-trigger-watchdog.service  # kept-argo: pre-1.0 unit basename
  - argo-trigger-watchdog.timer  # kept-argo: pre-1.0 unit basename
  - argo-logarchive@.service  # kept-argo: pre-1.0 unit basename
  - argo-logarchive@.timer  # kept-argo: pre-1.0 unit basename
  - argo-logrotate@.service  # kept-argo: pre-1.0 unit basename
  - argo-logrotate@.timer  # kept-argo: pre-1.0 unit basename
  - argo-disk-alert.service  # kept-argo: pre-1.0 unit basename
  - argo-disk-alert.timer  # kept-argo: pre-1.0 unit basename
  - argo-outbound-check.service  # kept-argo: pre-1.0 unit basename
  - argo-outbound-check.timer  # kept-argo: pre-1.0 unit basename

# Pre-1.0 scripts and drop-in config files. Their replacements are rendered by
# the owning role in the same run, so removing them here cannot leave a host
# without the behaviour — only without the duplicate.
rename_migration_files:
  - /usr/local/bin/argo-infra-ensure.sh  # kept-argo: pre-1.0 script path
  - /usr/local/bin/argo-docker-builder-prune  # kept-argo: pre-1.0 script path
  - /usr/local/bin/argo-outbound-check  # kept-argo: pre-1.0 script path
  - /usr/local/bin/argo-disk-alert  # kept-argo: pre-1.0 script path
  - /etc/systemd/journald.conf.d/99-argo-max-use.conf  # kept-argo: pre-1.0 drop-in
  - /etc/update-motd.d/99-argo-logs  # kept-argo: pre-1.0 motd snippet

# State directories whose contents must survive the rename. Copied with `cp -a`
# (contents and permissions preserved) and only then removed. The alert-override
# file under the config dir is the exception: it is derived from group_vars and
# alert_policy re-renders it later in the same run (see tasks/main.yml).
rename_migration_moves:
  - src: /etc/argo  # kept-argo: pre-1.0 config dir
    dest: /etc/bay
  - src: /var/lib/argo-outbound-check  # kept-argo: pre-1.0 probe state dir
    dest: /var/lib/bay-outbound-check

# Pre-1.0 container name. deploy_stack brings up `bay-webhook` in the same
# run, so the old container is removed rather than renamed.
rename_migration_container: argo-webhook  # kept-argo: pre-1.0 container name

# Pre-1.0 builder-prune cron job. The cronjobs role rewrites the entry under
# the same Ansible marker later in a deploy run; this only clears an entry that
# still points at the removed script.
rename_migration_cron_name: docker-builder-prune
rename_migration_cron_old_job: /usr/local/bin/argo-docker-builder-prune  # kept-argo: pre-1.0 script path

# systemd discovery inputs. The glob only *finds* candidates; the explicit
# rename_migration_units list above decides what is actually touched.
rename_migration_unit_glob: "argo-*"  # kept-argo: pre-1.0 unit prefix
rename_migration_unit_prefix: "argo-"  # kept-argo: pre-1.0 unit prefix

# Rendered under {{ stack_dir }}/bin, so it carries a variable path and cannot
# live in rename_migration_files.
rename_migration_watchdog_script: argo-trigger-watchdog.sh  # kept-argo: pre-1.0 script name
