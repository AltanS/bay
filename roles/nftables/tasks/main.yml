---
# nftables firewall configuration
# Manages firewall rules, integrates with CrowdSec bouncer
#
# WHY THE RELOAD IS NOT NOTIFIED BY THE TEMPLATE TASK
# ---------------------------------------------------
# Reloading nftables forces a Docker daemon restart (the handler chain below):
# Docker installs its own chains at daemon start and an nftables reload wipes
# them, so every container on the host bounces. That is an outage, and it must
# only ever be paid for a real change to the RULESET.
#
# `ansible.builtin.template` reports "changed" for ANY byte difference — so a
# comment-only edit to nftables.conf.j2 (or a re-rendered `ansible_managed`
# header) notified the handler and restarted Docker on every host. That is how
# a documentation change took down containers on four production hosts.
#
# The fix: hash the live file with comments and trailing whitespace stripped
# BEFORE the template writes, hash it again AFTER, and notify the handler from
# a separate flag task only when the two differ. The real file is always
# written, so comments still land on the host; only the reload is gated.
#
# Check mode: the template writes nothing, so before == after, the flag task's
# `when` is false and nothing is reloaded or restarted — while the template
# task still reports its diff. The two hash probes are read-only and carry
# `check_mode: false` so they produce a real answer in a dry run.
#
# First install: no live file, so the "before" hash is the hash of empty input
# and differs from "after" — treated as changed, as it must be.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: "{{ apt_package_state }}"
  become: true
  become_user: root

- name: Remove ufw (avoid conflicts)
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true
  become: true
  become_user: root

- name: Ensure nftables.d directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: root

# ── Pre-routing table (/etc/nftables.d/bay-prerouting.conf) ─────────────────
# Loaded on its own with `nft -f`, never through the reload handler: that
# handler restarts Docker. See defaults/main.yml for the variables.

- name: Check nftables_prerouting_rules entries
  ansible.builtin.assert:
    that:
      - _nft_pr_rule is mapping
      - _nft_pr_rule.rule | default('') is string
      - _nft_pr_rule.rule | default('') | trim | length > 0
      - "'\\n' not in _nft_pr_rule.rule | default('')"
      - "'\\n' not in _nft_pr_rule.comment | default('') | string"
    fail_msg: >-
      Each nftables_prerouting_rules entry needs a one-line `rule` string and
      an optional one-line `comment`. Bad entry: {{ _nft_pr_rule }}
    quiet: true
  loop: "{{ nftables_prerouting_rules | default([]) }}"
  loop_control:
    loop_var: _nft_pr_rule

- name: Check the tailnet address guard has an address
  ansible.builtin.assert:
    that:
      - (nftables_tailnet_guard_ip | default('', true) | string | trim | length > 0)
        or (hostvars[inventory_hostname] | bay_gateway_bind_ip | length > 0)
    fail_msg: >-
      nftables_tailnet_ip_guard is true, but this host has no tailnet address
      (gateway_bind_ip is empty). Set one, set
      nftables_tailnet_guard_ip, or turn the guard off.
    quiet: true
  when: nftables_tailnet_ip_guard | default(false) | bool

- name: Check the tailnet address guard knows the overlay interface
  ansible.builtin.assert:
    that:
      - nftables_tailnet_guard_iifname | default('', true) | string is match('^[A-Za-z0-9_.-]{1,15}$')
    fail_msg: >-
      nftables_tailnet_ip_guard is true, but the guard does not know the
      interface the overlay traffic comes in on. Bay knows it only for
      access_gateway headscale (tailscale0); this box has access_gateway
      {{ access_gateway | default('wireguard') }}. Set
      nftables_tailnet_guard_iifname (for example "wg0"), or turn the guard off.
    quiet: true
  when: nftables_tailnet_ip_guard | default(false) | bool

# A service of this box with tailnet_domains (bay.toml tailnet_hosts) is
# served on websecure_tailnet, which binds gateway_bind_ip. Without the guard
# for exactly that address, a host on the same network segment reaches it.
- name: Refuse to drop or move the guard of a box that serves tailnet hosts
  ansible.builtin.assert:
    that:
      - nftables_tailnet_ip_guard | default(false) | bool
      - _nft_guard_ip == (hostvars[inventory_hostname] | bay_gateway_bind_ip)
    fail_msg: >-
      This box serves tailnet hosts ({{ _nft_tailnet_services | join(', ') }}),
      so the tailnet address guard must stay on and guard gateway_bind_ip
      ({{ hostvars[inventory_hostname] | bay_gateway_bind_ip or 'empty' }}).
      Now: nftables_tailnet_ip_guard={{ nftables_tailnet_ip_guard | default(false) }},
      guard address {{ _nft_guard_ip or 'none' }}. Remove tailnet_hosts from
      those projects and run bay up first, or fix the group_vars.
    quiet: true
  vars:
    _nft_tailnet_services: "{{ services | default({}) | bay_host_tailnet_services(group_names) }}"
    _nft_guard_ip: >-
      {{ (nftables_tailnet_guard_ip | default('', true) | string | trim)
         or (hostvars[inventory_hostname] | bay_gateway_bind_ip) }}
  when: (services | default({}) | bay_host_tailnet_services(group_names) | length) > 0

- name: Deploy nftables pre-routing rules
  ansible.builtin.template:
    src: bay-prerouting.conf.j2
    dest: /etc/nftables.d/bay-prerouting.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  register: _nftables_prerouting_file
  become: true
  become_user: root

- name: Check the live pre-routing table
  ansible.builtin.command:
    cmd: nft list table inet bay_prerouting
  register: _nftables_prerouting_live
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

# Replaces only the bay_prerouting table. Docker's chains are untouched, so
# no Docker restart. Skipped in check mode (command module). It also runs when
# the guard is on but the live table does not hold it for the guard address
# (a hand edit, or a reload from another file): the deploy and rebuild.sh
# refuse tailnet hosts until it does, and their message sends the operator here.
- name: Apply nftables pre-routing rules
  ansible.builtin.command:
    cmd: nft -f /etc/nftables.d/bay-prerouting.conf
  changed_when: true
  vars:
    _nft_live_guard_address: >-
      {{ (nftables_tailnet_guard_ip | default('', true) | string | trim)
         or (hostvars[inventory_hostname] | bay_gateway_bind_ip) }}
  when: >-
    _nftables_prerouting_file is changed
    or _nftables_prerouting_live.rc != 0
    or ((nftables_tailnet_ip_guard | default(false) | bool)
        and not (_nftables_prerouting_live.stdout | default('')
                 | bay_tailnet_guard_live(_nft_live_guard_address | trim)))
  become: true
  become_user: root

# rebuild.sh runs as the app user and checks the live guard before it
# recreates a container with a tailnet host. This rule allows exactly one
# read-only command; nothing else.
- name: Let the app user read the pre-routing table
  ansible.builtin.copy:
    dest: /etc/sudoers.d/bay-nft-guard-read
    # No {{ ansible_managed }} here: it is defined for templates only, and a
    # copy task fails on it (caught on a live test box).
    content: |
      # Managed by Bay (nftables role). Do not edit by hand.
      # rebuild.sh checks the tailnet address guard with this one command.
      {{ app_user }} ALL=(root) NOPASSWD: {{ nftables_nft_path }} list table inet bay_prerouting
    owner: root
    group: root
    mode: "0440"
    validate: visudo -cf %s
  become: true
  become_user: root
  when: nftables_tailnet_ip_guard | default(false) | bool

- name: Remove the pre-routing read rule when the guard is off
  ansible.builtin.file:
    path: /etc/sudoers.d/bay-nft-guard-read
    state: absent
  become: true
  become_user: root
  when: not (nftables_tailnet_ip_guard | default(false) | bool)

- name: Find files in /etc/nftables.d that Bay does not manage
  ansible.builtin.find:
    paths: /etc/nftables.d
    patterns: "*.conf"
    excludes:
      - bay-prerouting.conf
      - bay-egress.conf
      - trellis-blocklist.conf
  register: _nftables_d_unmanaged
  become: true
  become_user: root

- name: Warn about unmanaged files in /etc/nftables.d
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _nftables_d_unmanaged.files | map(attribute='path') | join(', ') }}
      is not managed by Bay, but nftables.conf loads it at every reload and
      boot. Move its rules into nftables_prerouting_rules, then delete the
      file and its table.
  when: _nftables_d_unmanaged.files | length > 0

- name: Read live nftables ruleset fingerprint
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      sed -e 's/#.*$//' -e 's/[[:space:]]*$//' {{ nftables_config_path }} 2>/dev/null
      | grep -v '^[[:space:]]*$'
      | sha256sum
      | cut -d' ' -f1
    executable: /bin/bash
  register: _nftables_semantic_before
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

# NOTE: no `notify:` here. See the header — a comment-only diff must not
# restart Docker. The reload is notified by the flag task below.
- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root

- name: Re-read nftables ruleset fingerprint
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      sed -e 's/#.*$//' -e 's/[[:space:]]*$//' {{ nftables_config_path }} 2>/dev/null
      | grep -v '^[[:space:]]*$'
      | sha256sum
      | cut -d' ' -f1
    executable: /bin/bash
  register: _nftables_semantic_after
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

- name: Reload nftables only when the ruleset changed semantically
  ansible.builtin.debug:
    msg: >-
      nftables ruleset changed (comments ignored) — reloading nftables, which
      restarts the Docker daemon and bounces every container on this host.
  changed_when: true
  notify: Reload nftables
  when: _nftables_semantic_before.stdout != _nftables_semantic_after.stdout

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  become: true
  become_user: root

- name: Check if Docker service exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/docker.service
  register: _nftables_docker_unit
  become: true
  become_user: root
