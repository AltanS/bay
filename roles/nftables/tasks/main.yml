---
# nftables firewall configuration
# Manages firewall rules, integrates with CrowdSec bouncer
#
# WHY THE RELOAD IS NOT NOTIFIED BY THE TEMPLATE TASK
# ---------------------------------------------------
# Reloading nftables forces a Docker daemon restart (the handler chain below):
# Docker installs its own chains at daemon start and an nftables reload wipes
# them, so every container on the host bounces. That is an outage, and it must
# only ever be paid for a real change to the RULESET.
#
# `ansible.builtin.template` reports "changed" for ANY byte difference — so a
# comment-only edit to nftables.conf.j2 (or a re-rendered `ansible_managed`
# header) notified the handler and restarted Docker on every host. That is how
# a documentation change took down containers on four production hosts.
#
# The fix: hash the live file with comments and trailing whitespace stripped
# BEFORE the template writes, hash it again AFTER, and notify the handler from
# a separate flag task only when the two differ. The real file is always
# written, so comments still land on the host; only the reload is gated.
#
# Check mode: the template writes nothing, so before == after, the flag task's
# `when` is false and nothing is reloaded or restarted — while the template
# task still reports its diff. The two hash probes are read-only and carry
# `check_mode: false` so they produce a real answer in a dry run.
#
# First install: no live file, so the "before" hash is the hash of empty input
# and differs from "after" — treated as changed, as it must be.

- name: Install nftables
  ansible.builtin.apt:
    name: nftables
    state: "{{ apt_package_state }}"
  become: true
  become_user: root

- name: Remove ufw (avoid conflicts)
  ansible.builtin.apt:
    name: ufw
    state: absent
    purge: true
  become: true
  become_user: root

- name: Ensure nftables.d directory exists
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  become: true
  become_user: root

# ── Pre-routing table (/etc/nftables.d/bay-prerouting.conf) ─────────────────
# Loaded on its own with `nft -f`, never through the reload handler: that
# handler restarts Docker. See defaults/main.yml for the variables.

- name: Check nftables_prerouting_rules entries
  ansible.builtin.assert:
    that:
      - _nft_pr_rule is mapping
      - _nft_pr_rule.rule | default('') is string
      - _nft_pr_rule.rule | default('') | trim | length > 0
      - "'\\n' not in _nft_pr_rule.rule | default('')"
      - "'\\n' not in _nft_pr_rule.comment | default('') | string"
    fail_msg: >-
      Each nftables_prerouting_rules entry needs a one-line `rule` string and
      an optional one-line `comment`. Bad entry: {{ _nft_pr_rule }}
    quiet: true
  loop: "{{ nftables_prerouting_rules | default([]) }}"
  loop_control:
    loop_var: _nft_pr_rule

- name: Deploy nftables pre-routing rules
  ansible.builtin.template:
    src: bay-prerouting.conf.j2
    dest: /etc/nftables.d/bay-prerouting.conf
    owner: root
    group: root
    mode: "0644"
    validate: nft -c -f %s
  register: _nftables_prerouting_file
  become: true
  become_user: root

- name: Check the live pre-routing table
  ansible.builtin.command:
    cmd: nft list table inet bay_prerouting
  register: _nftables_prerouting_live
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

# Replaces only the bay_prerouting table. Docker's chains are untouched, so
# no Docker restart. Skipped in check mode (command module).
- name: Apply nftables pre-routing rules
  ansible.builtin.command:
    cmd: nft -f /etc/nftables.d/bay-prerouting.conf
  changed_when: true
  when: >-
    _nftables_prerouting_file is changed
    or _nftables_prerouting_live.rc != 0
  become: true
  become_user: root

- name: Find files in /etc/nftables.d that Bay does not manage
  ansible.builtin.find:
    paths: /etc/nftables.d
    patterns: "*.conf"
    excludes:
      - bay-prerouting.conf
      - bay-egress.conf
      - trellis-blocklist.conf
  register: _nftables_d_unmanaged
  become: true
  become_user: root

- name: Warn about unmanaged files in /etc/nftables.d
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ _nftables_d_unmanaged.files | map(attribute='path') | join(', ') }}
      is not managed by Bay, but nftables.conf loads it at every reload and
      boot. Move its rules into nftables_prerouting_rules, then delete the
      file and its table.
  when: _nftables_d_unmanaged.files | length > 0

- name: Read live nftables ruleset fingerprint
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      sed -e 's/#.*$//' -e 's/[[:space:]]*$//' {{ nftables_config_path }} 2>/dev/null
      | grep -v '^[[:space:]]*$'
      | sha256sum
      | cut -d' ' -f1
    executable: /bin/bash
  register: _nftables_semantic_before
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

# NOTE: no `notify:` here. See the header — a comment-only diff must not
# restart Docker. The reload is notified by the flag task below.
- name: Deploy nftables configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nftables_config_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  become_user: root

- name: Re-read nftables ruleset fingerprint
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      sed -e 's/#.*$//' -e 's/[[:space:]]*$//' {{ nftables_config_path }} 2>/dev/null
      | grep -v '^[[:space:]]*$'
      | sha256sum
      | cut -d' ' -f1
    executable: /bin/bash
  register: _nftables_semantic_after
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root

- name: Reload nftables only when the ruleset changed semantically
  ansible.builtin.debug:
    msg: >-
      nftables ruleset changed (comments ignored) — reloading nftables, which
      restarts the Docker daemon and bounces every container on this host.
  changed_when: true
  notify: Reload nftables
  when: _nftables_semantic_before.stdout != _nftables_semantic_after.stdout

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  become: true
  become_user: root

- name: Check if Docker service exists
  ansible.builtin.stat:
    path: /usr/lib/systemd/system/docker.service
  register: _nftables_docker_unit
  become: true
  become_user: root
