---
# nftables role defaults

nftables_config_path: /etc/nftables.conf

# IPs that bypass CrowdSec bouncer enforcement entirely.
# These are accepted at priority -20 (before CrowdSec's -10) so CAPI
# community blocklist decisions cannot lock out admin access.
# Set in consumer group_vars — e.g., your company VPN exit IP.
crowdsec_trusted_ips: []

# ── Container-to-host input policy ──────────────────────────────────────────
# Ports the host serves to containers over the docker/bridge/veth interfaces.
#
# EMPTY (the default) = accept everything from `docker*`, `br-*` and `veth*`
# into the host input chain — today's behaviour, unchanged. The default is
# permissive on purpose: what a host serves its containers is entirely
# consumer-specific (DNS on 53, healthcheck endpoints, a host-side database, a
# metrics scrape target …), and guessing that set wrong silently breaks
# container networking in ways that look like an application bug.
#
# To lock it down, list the ports you actually serve. Anything not listed is
# then dropped from container interfaces:
#
#   nftables_container_host_ports:
#     - { port: 53, proto: udp }     # docker embedded DNS → host resolver
#     - { port: 53, proto: tcp }
#     - { port: 8082, proto: tcp }   # traefik metrics
#
# `proto` defaults to tcp. Established/related traffic is accepted earlier in
# the chain regardless, so this only governs container-initiated connections.
# Tighten this on a host you can still reach out-of-band.
nftables_container_host_ports: []

# ── Forward chain ───────────────────────────────────────────────────────────
# The `forward` chain is `policy drop` followed by a bare `accept`, which makes
# the drop policy decorative. It stays that way by default because Docker
# manages its own forward rules and container-to-container / container-to-
# internet traffic depends on it. Set to false to let the drop policy actually
# apply — established/related traffic is still accepted, so do this only on a
# host whose container networking you have verified, and out-of-band.
nftables_forward_permissive: true

# ── Pre-routing rules ───────────────────────────────────────────────────────
# Rules that must run before routing, conntrack and Docker's DNAT, such as an
# emergency kernel-CVE mitigation. The `input` chain cannot hold them: a
# Docker-published port bypasses it.
#
# The role renders them into /etc/nftables.d/bay-prerouting.conf, as the table
# `inet bay_prerouting` (hook prerouting, priority -350, policy accept). A
# change loads that one table with `nft -f`. It does NOT reload nftables.conf
# and does NOT restart Docker, so an emergency rule costs no container bounce.
# The file is checked with `nft -c` before it is written; a bad rule fails the
# task and leaves the live rules as they were.
#
# Drop IPv4 TCP packets that carry IP options. Legitimate TCP does not use
# them, and they are attack surface (CVE-2026-98432, a use-after-free in IPv4
# option parsing). Set false only on a host with a real need for them.
nftables_drop_ipv4_options: true

# Extra rules, one nft rule statement each, in order. `comment` is optional.
#
#   nftables_prerouting_rules:
#     - comment: "drop a hostile range before conntrack"
#       rule: "ip saddr 192.0.2.0/24 counter drop"
nftables_prerouting_rules: []

# ── Tailnet address guard ───────────────────────────────────────────────────
# Drop every packet addressed to this box's tailnet address that did not come
# in on tailscale0, the loopback or a container interface (docker*, br-*,
# veth*). Linux accepts a packet for any local address on any interface, and
# Tailscale's own rules check only the SOURCE address. So without this guard
# a host on the same network segment can reach the tailnet-only listeners
# (Traefik websecure_tailnet) through the public interface.
#
# Opt-in. Turn it on for a box with traefik_split_entrypoints that serves a
# bay.toml `tailnet_hosts` name: the compile and the deploy refuse
# `tailnet_hosts` on a box where this is off. It lives in the bay_prerouting
# table above, so a change reloads that table alone, with no Docker restart.
# Apply with `bay deploy <env> --tags nftables` (bay up does not run this role).
#
# The address is the box's gateway_bind_ip (the access-gateway overlay IP),
# read through the bay_gateway_bind_ip resolver. nftables_tailnet_guard_ip
# overrides it, but on a box that serves a tailnet host it must equal
# gateway_bind_ip (the address Traefik's websecure_tailnet binds): the role
# refuses anything else, and it refuses to turn the guard off there. IPv4 only.
#
# The interface the overlay traffic comes in on, from the access-gateway
# adapter (`gateway_interface`). Bay knows it only for the headscale backend
# (tailscale0). For any other backend it is empty and the role refuses the
# guard: set it by hand (for example "wg0" for WireGuard).
nftables_tailnet_ip_guard: false
nftables_tailnet_guard_ip: ""
nftables_tailnet_guard_iifname: "{{ hostvars[inventory_hostname] | bay_gateway_interface }}"

# A box with the guard on lets the app user read the bay_prerouting table with
# sudo, for exactly one command. rebuild.sh needs it: a webhook rebuild of a
# container with a tailnet host checks the live guard before it recreates the
# container. The rule is removed when the guard is off.
nftables_nft_path: /usr/sbin/nft

# ── Ownership of /etc/nftables.d/ ───────────────────────────────────────────
# nftables.conf ends with `include "/etc/nftables.d/*.conf"`. Bay writes three
# files there:
#
#   bay-prerouting.conf    this role (the rules above)
#   bay-egress.conf        container_lifecycle role, on every bay up, only on a
#                          box with an egress container (bay.toml `egress`)
#   trellis-blocklist.conf crowdsec role (ip_blocklist CIDR set)
#
# Any other *.conf there is unsupported. Bay does not remove it, but each run
# of this role names it in a warning, so a hand-placed rule cannot hide. Move
# its rules into nftables_prerouting_rules, then delete the file and its table.
