---
# SSH daemon hardening — drop-in config
# Deploys directives not supported by geerlingguy.security

- name: Deploy sshd hardening drop-in config
  ansible.builtin.template:
    src: 99-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    owner: root
    group: root
    mode: '0644'
  notify: Restart sshd
  when: sshd_hardening_enabled | bool
