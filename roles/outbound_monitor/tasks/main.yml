---
# Outbound connectivity monitor
# Deploys a systemd timer that probes external endpoints and sends Telegram
# alerts on connectivity loss and recovery.

# ── State directory ──────────────────────────────────────────────────────────

- name: Create outbound check state directory
  ansible.builtin.file:
    path: "{{ outbound_check_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Initialize state file to up (first-run default)
  ansible.builtin.copy:
    content: "up\n"
    dest: "{{ outbound_check_state_dir }}/state"
    owner: root
    group: root
    mode: "0644"
    force: false
  become: true

# ── Probe script ─────────────────────────────────────────────────────────────

- name: Deploy outbound check probe script
  ansible.builtin.template:
    src: bay-outbound-check.j2
    dest: /usr/local/bin/bay-outbound-check
    owner: root
    group: root
    mode: "0750"
  become: true

# ── systemd units ────────────────────────────────────────────────────────────

- name: Deploy outbound check systemd service unit
  ansible.builtin.template:
    src: bay-outbound-check.service.j2
    dest: /etc/systemd/system/bay-outbound-check.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy outbound check systemd timer unit
  ansible.builtin.template:
    src: bay-outbound-check.timer.j2
    dest: /etc/systemd/system/bay-outbound-check.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _outbound_check_timer_unit

# ── Enable path ──────────────────────────────────────────────────────────────
# Check mode writes no unit file. On a host that does not have a timer yet, the
# systemd module cannot find the unit and fails the dry run ("Could not find the
# requested service"). So the enable and disable tasks of every timer in this
# file skip when the run is a check and its unit file task reports changed.
# A real run is not affected.

- name: Enable and start outbound check timer
  ansible.builtin.systemd:
    name: bay-outbound-check.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - outbound_check_enabled
    - not (ansible_check_mode and _outbound_check_timer_unit is changed)

# ── Disable path ─────────────────────────────────────────────────────────────

- name: Stop, disable and mask outbound check timer
  ansible.builtin.systemd:
    name: bay-outbound-check.timer
    enabled: false
    state: stopped
    masked: true
    daemon_reload: true
  become: true
  when:
    - not outbound_check_enabled
    - not (ansible_check_mode and _outbound_check_timer_unit is changed)

# ── Disk pressure alerts ──────────────────────────────────────────────────────
# Reuses outbound_check_state_dir for the dedup state file — one directory
# for all bay probe state keeps inventory clean.

- name: Deploy disk alert probe script
  ansible.builtin.template:
    src: bay-disk-alert.sh.j2
    dest: /usr/local/bin/bay-disk-alert
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Deploy disk alert systemd service unit
  ansible.builtin.template:
    src: bay-disk-alert.service.j2
    dest: /etc/systemd/system/bay-disk-alert.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy disk alert systemd timer unit
  ansible.builtin.template:
    src: bay-disk-alert.timer.j2
    dest: /etc/systemd/system/bay-disk-alert.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _disk_alert_timer_unit

- name: Enable and start disk alert timer
  ansible.builtin.systemd:
    name: bay-disk-alert.timer
    enabled: true
    state: started
    daemon_reload: true
  become: true
  when:
    - disk_alert_enabled | bool
    - not (ansible_check_mode and _disk_alert_timer_unit is changed)

- name: Stop, disable and mask disk alert timer
  ansible.builtin.systemd:
    name: bay-disk-alert.timer
    enabled: false
    state: stopped
    masked: true
    daemon_reload: true
  become: true
  when:
    - not (disk_alert_enabled | bool)
    - not (ansible_check_mode and _disk_alert_timer_unit is changed)

# ── Pending reboot alert ──────────────────────────────────────────────────────
# Same state directory as the disk alert. Daily timer, root service unit.

- name: Deploy reboot alert probe script
  ansible.builtin.template:
    src: bay-reboot-alert.sh.j2
    dest: /usr/local/bin/bay-reboot-alert
    owner: root
    group: root
    mode: "0750"
  become: true

- name: Deploy reboot alert systemd service unit
  ansible.builtin.template:
    src: bay-reboot-alert.service.j2
    dest: /etc/systemd/system/bay-reboot-alert.service
    owner: root
    group: root
    mode: "0644"
  become: true

- name: Deploy reboot alert systemd timer unit
  ansible.builtin.template:
    src: bay-reboot-alert.timer.j2
    dest: /etc/systemd/system/bay-reboot-alert.timer
    owner: root
    group: root
    mode: "0644"
  become: true
  register: _reboot_alert_timer_unit

- name: Enable and start reboot alert timer
  ansible.builtin.systemd:
    name: bay-reboot-alert.timer
    enabled: true
    state: started
    masked: false
    daemon_reload: true
  become: true
  when:
    - reboot_alert_enabled | bool
    - not (ansible_check_mode and _reboot_alert_timer_unit is changed)

- name: Stop, disable and mask reboot alert timer
  ansible.builtin.systemd:
    name: bay-reboot-alert.timer
    enabled: false
    state: stopped
    masked: true
    daemon_reload: true
  become: true
  when:
    - not (reboot_alert_enabled | bool)
    - not (ansible_check_mode and _reboot_alert_timer_unit is changed)
