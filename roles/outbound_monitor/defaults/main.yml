---
outbound_check_enabled: true
outbound_check_interval: "5min"
outbound_check_endpoints:
  - "https://1.1.1.1"
  - "https://8.8.8.8"
  - "https://www.google.com"
outbound_check_timeout: 10
outbound_check_state_dir: "/var/lib/bay-outbound-check"

# Alert credentials. This role historically read the BARE names below while
# every other role reads docker_monitor_telegram_*, so a consumer that
# configured Telegram the normal way got outbound and disk alerts rendered
# with an empty token — the alerts were built, POSTed to
# https://api.telegram.org/bot/sendMessage, and silently discarded by the
# `|| true` guard. Both templates now prefer docker_monitor_telegram_* and
# fall back to these names, so existing overrides keep working.
#
# Deprecated: set docker_monitor_telegram_bot_token / _chat_id instead.
telegram_bot_token: ""
telegram_chat_id: ""

# Disk pressure alerts. State-file deduped so the on-call only
# hears about threshold crossings, not every 15-minute tick while pressure
# persists. Alert body includes `df -h /` and `docker system df` so the
# first responder can tell Docker bloat from other consumers without
# SSHing. A 2026-04-17 incident hit 76% disk with zero warning —
# this is the safety net.
disk_alert_enabled: true
disk_alert_warn_pct: 80
disk_alert_page_pct: 90
disk_alert_interval: "15min"

# Pending reboot alert. unattended-upgrades installs a kernel update but never
# reboots, so a host can run for months with /var/run/reboot-required in place
# and nobody hears about it. A daily timer (bay-reboot-alert) alerts
# (host.reboot_pending, level warn) when that file is older than
# reboot_alert_threshold_days. While the reboot stays pending it repeats once
# per reboot_alert_repeat_days, never daily. The state file
# <outbound_check_state_dir>/reboot-alert.state holds first_seen and last_alert
# (two key=value lines) and is cleared when the file is gone. The age counts
# from first_seen, the older of the stored value and the file mtime. A later
# package that needs a reboot rewrites the file but does not restart the
# clock. Like the disk alert, this role runs from provision.yml:
# install on existing hosts with `bay provision <env> --tags outbound_monitor`.
reboot_alert_enabled: true
reboot_alert_threshold_days: 7
reboot_alert_repeat_days: 7

# Certificate expiry alert. Traefik renews its ACME certificates itself, so a
# failing renewal goes unseen until a browser shows an error. A daily timer
# (bay-cert-alert) reads the certificates in Traefik's ACME stores (domain
# names and chain only, never the private key) and alerts per certificate:
# host.cert_expiry_warn (level warn) under cert_alert_warn_days days left,
# host.cert_expiry_page (level critical) under cert_alert_page_days days left.
# At most one alert per certificate per day. A certificate more than
# cert_alert_expired_days days past its end date is muted for good (it is
# usually an orphan: remove its entry from the store, then restart traefik).
# State: <outbound_check_state_dir>/cert-alert/<sha256 fingerprint>.state, with
# last_alert_day=YYYY-MM-DD and optionally muted=1. A store that exists but
# cannot be parsed fails the unit (exit 1) and sends no alert.
# Like the disk and reboot alerts, this role runs from provision.yml: install
# on existing hosts with `bay provision <env> --tags outbound_monitor`.
cert_alert_enabled: true
# The two paths repeat the traefik role's traefik_acme_path and
# traefik_acme_dns_path. Role defaults are not visible across roles, so keep
# them in step by hand. A store that does not exist is skipped.
cert_alert_acme_files:
  - "{{ stack_dir }}/acme.json"
  - "{{ stack_dir }}/acme-dns.json"
# Traefik's dynamic dir (the traefik role's {{ stack_dir }}/dynamic). Its
# Host(...) rules count as served names, next to the docker labels: a due
# certificate that no router serves is logged, not alerted.
cert_alert_dynamic_dir: "{{ stack_dir }}/dynamic"
cert_alert_warn_days: 21
cert_alert_page_days: 7
cert_alert_expired_days: 7
