---
# Headscale coordination server
# Deploys config and data directories for the self-hosted Tailscale control plane.
# The container itself is managed by the container_lifecycle role.

# -- Validation ---------------------------------------------------------------

- name: Validate headscale_domain is set
  ansible.builtin.assert:
    that:
      - headscale_domain | length > 0
    fail_msg: >-
      headscale_domain must be set to the public FQDN of the Headscale server
      (e.g. headscale.example.com). Set it in group_vars.
  tags: [headscale]

- name: Validate headscale_ip_allocation
  ansible.builtin.assert:
    that:
      - headscale_ip_allocation in ['random', 'sequential']
    fail_msg: >-
      headscale_ip_allocation is '{{ headscale_ip_allocation }}'. It must be
      'random' (the default) or 'sequential'. Headscale itself refuses any other
      value and would crash-loop on start.
    quiet: true
  tags: [headscale]

# The hardened modes below (data folder 0700, db.sqlite 0600, both root-only
# for the DB) lock out the tailnet-identity sidecar's `sqlite` source: it runs
# as the non-root `identity` user and reads /opt/headscale/data through a
# read-only mount. The default `api` source reads nothing from disk.
- name: Refuse the tailnet-identity sqlite source on a hardened data folder
  ansible.builtin.assert:
    that:
      - (tailnet_identity_source | default('api')) != 'sqlite'
    fail_msg: >-
      tailnet_identity_source is 'sqlite', but the Headscale data folder is now
      0700 and db.sqlite 0600 root-only, so the sidecar (user `identity`) cannot
      read it. Use tailnet_identity_source: api (the default) with
      tailnet_identity_api_key in the vault.
    quiet: true
  when: tailnet_identity_enabled | default(false) | bool
  tags: [headscale]

# -- Directory Setup ----------------------------------------------------------
# Owner app_user, as before: the role's own template tasks run as app_user.
# Headscale runs as root in the container with every capability dropped except
# DAC_OVERRIDE, which is what lets it read and write these app_user folders.
# config 0750: nothing outside app_user and the docker group reads it.
# data 0700: noise and DERP private keys plus the node DB; the only readers
# are Headscale itself and the root backup helper
# (roles/backup/templates/headscale-db-snapshot.sh.j2).

- name: Create headscale config directory
  ansible.builtin.file:
    path: /opt/headscale/config
    state: directory
    owner: "{{ app_user }}"
    group: docker
    mode: "0750"
  become: true
  become_user: root
  tags: [headscale]

- name: Create headscale data directory
  ansible.builtin.file:
    path: /opt/headscale/data
    state: directory
    owner: "{{ app_user }}"
    group: docker
    mode: "0700"
  become: true
  become_user: root
  tags: [headscale]

# Headscale runs with umask 0022, so a fresh db.sqlite is 0644. SQLite creates
# the -wal and -shm files with the mode of db.sqlite, and removes them on a clean
# stop, so once db.sqlite is 0600 they follow from the next start on. This also
# tightens any DB copy an operator left beside it (db.sqlite.bak-*) or in
# /opt/headscale/backups. It never deletes a file. On a fresh install the DB
# does not exist yet at this point; the next run fixes it.
- name: Find headscale database files and copies
  ansible.builtin.find:
    paths:
      - /opt/headscale/data
      - /opt/headscale/backups
    patterns:
      - "*.sqlite"
      - "*.sqlite-*"
      - "*.sqlite.*"
    file_type: file
  register: _headscale_db_files
  become: true
  become_user: root
  tags: [headscale]

- name: Restrict headscale database files to root (0600)
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: "0600"
  loop: "{{ _headscale_db_files.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  become: true
  become_user: root
  tags: [headscale]

# -- Trusted proxy (Traefik) --------------------------------------------------
# headscale_trusted_proxies (defaults/main.yml) is computed from the gateway of
# the docker network Traefik uses to reach the container. The traefik role
# creates that network later in the play, so create it here first: on a fresh
# host the first deploy then already renders trusted_proxies. Same task as in
# roles/traefik, idempotent.

- name: Ensure the docker network between Traefik and headscale exists
  community.docker.docker_network:
    name: "{{ traefik_docker_network | default('services') }}"
    state: present
  tags: [headscale]

# Read-only, so it also runs in check mode. A missing network (a fresh host
# in check mode) leaves the list empty, and nothing is rendered.
- name: Read the docker network between Traefik and headscale
  ansible.builtin.command:
    cmd: docker network inspect {{ traefik_docker_network | default('services') }}
  register: _headscale_network_inspect
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root
  tags: [headscale]

- name: Compute the address Traefik reaches headscale from
  ansible.builtin.set_fact:
    _headscale_proxy_gateways: >-
      {{ (_gateways | reject('search', ':') | map('regex_replace', '$', '/32') | list)
         + (_gateways | select('search', ':') | map('regex_replace', '$', '/128') | list) }}
  vars:
    _gateways: >-
      {{ _ipam | selectattr('Gateway', 'defined') | map(attribute='Gateway')
         | select | map('string') | list }}
    _inspect_ok: >-
      {{ _headscale_network_inspect is not skipped
         and (_headscale_network_inspect.rc | default(1)) == 0
         and (_headscale_network_inspect.stdout | default('') | trim | length) > 0 }}
    _ipam: >-
      {{ ((_headscale_network_inspect.stdout | from_json | first).IPAM.Config | default([], true))
         if _inspect_ok else [] }}
  tags: [headscale]

- name: Validate headscale_trusted_proxies
  ansible.builtin.assert:
    that:
      - headscale_trusted_proxies is not string
      - headscale_trusted_proxies is iterable
      - headscale_trusted_proxies | select('string') | list | length == headscale_trusted_proxies | length
      - >-
        headscale_trusted_proxies
        | reject('match', '^([0-9]{1,3}[.]){3}[0-9]{1,3}/([1-9]|[12][0-9]|3[0-2])$')
        | reject('match', '^[0-9A-Fa-f]*:[0-9A-Fa-f:.]*/([1-9][0-9]?|1[01][0-9]|12[0-8])$')
        | list | length == 0
    fail_msg: >-
      headscale_trusted_proxies must be a list of prefixes such as
      "172.18.0.1/32". It is {{ headscale_trusted_proxies }}. Headscale refuses
      a bare IP, 0.0.0.0/0 and ::/0, and would crash-loop on start. Use [] to
      turn it off.
    quiet: true
  tags: [headscale]

# -- Configuration ------------------------------------------------------------

- name: Template headscale config
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /opt/headscale/config/config.yaml
    owner: "{{ app_user }}"
    # 0640, not 0644: this file carries headscale_oidc_client_secret. The
    # container runs as root without the usual capabilities; it reads this
    # app_user file through DAC_OVERRIDE (container_lifecycle build_specs.yml).
    mode: "0640"
  notify: Restart headscale
  tags: [headscale]

- name: Template split-DNS extra records
  ansible.builtin.template:
    src: extra-records.json.j2
    dest: /opt/headscale/config/extra-records.json
    owner: "{{ app_user }}"
    mode: "0644"
  notify: Restart headscale
  tags: [headscale]

# -- ACL Policy (file mode, opt-in) -------------------------------------------
# Rendered only when headscale_acl_policy is defined. WARNING: defining a policy
# flips the tailnet from default-allow to default-deny — every required flow must
# be enumerated in the var or it will be blocked. See defaults/main.yml.
#
# Staged and validated BEFORE the live policy is replaced. An invalid policy makes
# headscale crash-loop on start, and because the running tailnet coasts on its
# cached policy until the container actually dies, the breakage surfaces long after
# the deploy that caused it. So: render to a staging path, run `headscale policy
# check` against it, and only install once it passes. A bad policy fails the play
# with headscale's own parser error and leaves the live policy untouched.
#
# Validation runs via `docker exec` into the RUNNING container. As of headscale
# 0.29 `policy check` is a thin gRPC frontend to a live server: from a throwaway
# container it aborts on a confirmation prompt unless given
# --bypass-grpc-and-access-database-directly, which opens the DB directly and is
# explicitly unsafe while headscale is running. On 0.28 the same exec is a local
# parse, so this form is correct on both. It is SKIPPED (loudly) when the
# container isn't running — being unable to check must never masquerade as a
# failed check, or a valid policy would be rejected on a first-ever deploy.
#
# CAVEAT: on a headscale_version bump the OLD binary validates, because this role
# runs before deploy_stack recreates the container. Version-gated policy semantics
# (e.g. 0.29 resolving `*` to the CGNAT/ULA ranges instead of all IPs) must be
# pre-checked out of band against the target image before bumping.
#
# CHECK MODE (2.20.0): the probe, the staging write, the validation and the
# cleanup carry `check_mode: false`. They only read, or write a hidden staging
# file that the last task removes. So `--check` validates the new policy too,
# and a dry run fails on an invalid one. Before, check mode skipped the probe,
# printed that the container was not running (false), and the policy was first
# validated in the real run. Only the install task stays skipped in check mode.

- name: Check headscale container is running for policy validation
  ansible.builtin.command:
    cmd: docker ps --filter name=^headscale$ --filter status=running --quiet
  register: headscale_container_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root
  when: headscale_acl_policy is defined
  tags: [headscale]

# In check mode the config folder may not exist yet (a fresh host: the
# folder task above only predicts it). Stage only when the container runs
# there, which proves the folder exists; then there is something to validate.
- name: Stage headscale ACL policy for validation
  ansible.builtin.template:
    src: policy.hujson.j2
    dest: /opt/headscale/config/.policy.hujson.staged
    owner: "{{ app_user }}"
    mode: "0644"
  check_mode: false
  when:
    - headscale_acl_policy is defined
    - not ansible_check_mode or (headscale_container_check.stdout | default('') | trim) != ''
  changed_when: false
  tags: [headscale]

- name: Warn that headscale ACL policy cannot be validated
  ansible.builtin.debug:
    msg: >-
      SKIPPING ACL validation — the headscale container is not running, so
      `headscale policy check` cannot run. The policy will be installed
      UNVALIDATED; if it is malformed headscale will crash-loop on start.
  when:
    - headscale_acl_policy is defined
    - (headscale_container_check.stdout | default('') | trim) == ''
  tags: [headscale]

- name: Validate staged headscale ACL policy
  ansible.builtin.command:
    cmd: >-
      docker exec headscale
      headscale policy check --file /etc/headscale/.policy.hujson.staged
  register: headscale_policy_check
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root
  when:
    - headscale_acl_policy is defined
    - (headscale_container_check.stdout | default('') | trim) != ''
  tags: [headscale]

# A dry run leaves nothing behind, also when the assert below fails it. A
# real run keeps a rejected policy for inspection and removes a valid one at
# the end.
- name: Remove the staged headscale ACL policy after a dry-run check
  ansible.builtin.file:
    path: /opt/headscale/config/.policy.hujson.staged
    state: absent
  check_mode: false
  when:
    - headscale_acl_policy is defined
    - ansible_check_mode
  changed_when: false
  tags: [headscale]

- name: Assert headscale ACL policy is valid
  ansible.builtin.assert:
    that:
      - headscale_policy_check.rc == 0
    fail_msg: >-
      headscale_acl_policy is INVALID — refusing to install it. The live policy on
      the host is untouched and the tailnet is unaffected. Fix headscale_acl_policy
      in group_vars and re-run{{ ' (found by a dry run)' if ansible_check_mode else
      '; the rejected policy is kept at /opt/headscale/config/.policy.hujson.staged
      for inspection' }}. headscale said:
      {{ (headscale_policy_check.stderr | default('') ~ ' ' ~ headscale_policy_check.stdout | default('')) | trim }}
    success_msg: headscale ACL policy is valid.
  when:
    - headscale_acl_policy is defined
    # `is not skipped` rather than re-testing the container probe: it is
    # skipped exactly when the probe found no running container.
    - headscale_policy_check is not skipped
  tags: [headscale]

# Nothing to install in a dry run: installing is exactly the host write that
# check mode must not perform. The validation above already ran in check mode.
#
# NOT guarded on the staging task's registered result: `ansible_check_mode`
# is the only honest signal here. In check mode on a fresh host nothing was
# staged, and a copy from the missing staged file would abort the play.
- name: Install validated headscale ACL policy
  ansible.builtin.copy:
    src: /opt/headscale/config/.policy.hujson.staged
    dest: /opt/headscale/config/policy.hujson
    remote_src: true
    owner: "{{ app_user }}"
    mode: "0644"
  when:
    - headscale_acl_policy is defined
    - not ansible_check_mode
  notify: Restart headscale
  tags: [headscale]

# check_mode: false, or a dry run would leave the staged file behind. Removing
# a file that is not there changes nothing, also on a fresh host.
- name: Remove staged headscale ACL policy
  ansible.builtin.file:
    path: /opt/headscale/config/.policy.hujson.staged
    state: absent
  check_mode: false
  when: headscale_acl_policy is defined
  changed_when: false
  tags: [headscale]

# -- Container image ----------------------------------------------------------
# Rendering the config does not change the running image: the container keeps
# the image it was created from, and the "Restart headscale" handler only
# restarts it. Before 2.8.0 a `headscale_version` bump therefore reached the
# host only through a full `deploy_stack` run, which also reconciles Traefik and
# every other container on the box. Reconcile the headscale container alone,
# through the same spec deploy_stack uses (build_specs.yml), so
# `bay deploy <env> --tags headscale` moves it onto the pinned image and a
# current one is a NoOp. Same pattern as the webhook receiver
# (roles/git_deploy/tasks/webhook.yml).
#
# Only headscale is in the bundle, so orphan removal is off. A host with no
# headscale container yet is left to deploy_stack, which creates it with the
# network and the rest of the rig.

- name: Check whether the headscale container exists
  ansible.builtin.command:
    cmd: docker ps --all --filter name=^headscale$ --quiet
  register: _headscale_container_exists
  changed_when: false
  failed_when: false
  check_mode: false
  become: true
  become_user: root
  tags: [headscale]

- name: Bring headscale onto the pinned image
  ansible.builtin.include_role:
    name: container_lifecycle
    apply:
      tags: [headscale]
  vars:
    container_lifecycle_only: [headscale]
    bay_reconciler_remove_orphans: false
  when: (_headscale_container_exists.stdout | default('') | trim) | length > 0
  tags: [headscale]

# Tells the "Restart headscale" handler that the reconciler just recreated the
# container, which then read the config rendered above, so a restart would be
# a second reconnect of every node for nothing.
- name: Record whether the reconciler changed headscale
  ansible.builtin.set_fact:
    _headscale_reconciled: >-
      {{ (_reconcile_result.stdout | default('{}') | from_json).changed | default(false)
         if (_reconcile_result is defined and _reconcile_result is not skipped
             and (_reconcile_result.stdout | default('')) | length > 0)
         else false }}
  when: (_headscale_container_exists.stdout | default('') | trim) | length > 0
  tags: [headscale]
