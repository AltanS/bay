---
# Headscale — coordination server for the tailnet (mesh VPN that links
# regions for cross-region service links and operator peer-to-peer
# debugging).
#
# Split-DNS gotchas (operators):
#
# - **Hardcoded domains in multi-region cause duplicate YAML keys** — If a
#   service uses a literal domain (e.g., `blog.example.com`) instead of
#   `{{ domain_base }}`, the split-DNS template iterates all hosts and
#   emits the same domain twice in `dns.nameservers.split`. Headscale
#   0.28's Go YAML parser is strict and crashes on duplicate mapping keys.
#   Fixed in v0.43.1: templates now filter by `svc.regions` and
#   deduplicate by domain.
# - **Partial deploys leave split-DNS stale** — The headscale role only
#   runs on the control region host. If you add a VPN service and deploy
#   only the service's region (`--tags deploy_stack`), the headscale
#   split-DNS records on the control server are not updated. Always
#   redeploy the headscale tag on the control region after adding/changing
#   VPN services: `bay deploy production --tags headscale`.
# - **`bay logs` and `bay restart` don't work for infrastructure
#   containers** — Headscale and Traefik are not in
#   `services.yml`, so CLI commands that validate against it will reject
#   them. Use `bay gateway status` to check headscale health, or ansible
#   ad-hoc for direct container access.
#
# Admin API (since 2.19.0):
#
# - **The REST API is closed.** `/api/...` and `/swagger` on headscale_domain
#   answer 403 unless the client IP is in `headscale_admin_api_allowed_ips`
#   (2.20.0, default loopback only: 127.0.0.1/32 and ::1/128). A second
#   Traefik router does this, with its own ipAllowList middleware
#   `headscale-admin-allow` behind public-chain. Its labels are built in
#   container_lifecycle/tasks/build_specs.yml, gated by
#   `headscale_admin_api_public` (default false). Both variables live in the
#   access_gateway defaults. From 2.19.0 to 2.19.1 the router used vpn-chain,
#   so every tailnet node, tenant nodes too, reached the API.
#   The tailscale protocol paths (/ts2021, /key, /register, /oidc, /verify,
#   /derp, /apple, /windows, /health ...) stay public; clients need them.
# - **Open it for one device.** Add the device's tailnet IP (from
#   `bay gateway nodes`) to the list in group_vars/all, keep the loopback
#   entries, and run `bay deploy <env> --tags headscale`:
#     headscale_admin_api_allowed_ips: ["127.0.0.1/32", "::1/128", "100.64.0.7/32"]
#   The device then calls the control host's tailnet IP with the Headscale
#   host name, for example
#   `curl --resolve hs.example.com:443:<tailnet IP> https://hs.example.com/api/v1/node`.
#   Under a Headscale ACL the device also needs an accept rule to the control
#   host on port 443.
# - **Bay itself does not need the API.** `bay gateway ...` and the local
#   tailscale_register path run `docker exec headscale headscale ...` on the
#   control host. A box in another region registers by a task delegated to the
#   control host over SSH (tailscale_register, `headscale_register_via_api`).
# - **Limit.** A deploy machine with no SSH to the control host cannot enrol
#   a box of another region, unless the fleet opts back in: set
#   `headscale_register_via_api: true` and `headscale_admin_api_public: true`
#   and keep `headscale_api_key` in the vault.
# - The tailnet-identity sidecar calls the API at http://headscale:8080 on the
#   docker network, not through Traefik, so the gate does not touch it.

headscale_domain: ""
headscale_dns_global_nameservers: []
# Operator-defined split-DNS A records, merged into extra-records.json and
# config.yaml's dns.nameservers.split alongside the auto-generated
# `access: vpn` service and `tailnet_proxies` records (same seen_domains
# dedup — first writer wins). Use this for a manual mapping Bay can't derive
# on its own, e.g. an externally-managed tailnet node that publicly resolves
# elsewhere but should resolve to its tailnet IP for tailnet clients:
#   headscale_extra_dns_records:
#     - name: example.com      # domain
#       value: 100.64.0.7      # tailnet IP
#       # type: A              # optional, defaults to A
# See docs/access-gateways.md#split-dns-for-vpn-services.
headscale_extra_dns_records: []
headscale_magic_dns_domain: "{{ stack_name }}.tailnet.internal"
# Second copy, for this role's own tasks. The pin that decides the running
# image lives in roles/access_gateway/defaults/main.yml; change both together
# or tests/test_headscale_version_pin.py fails.
headscale_version: "0.29.7"
# How Headscale picks the tailnet IP of a NEW node (`prefixes.allocation` in
# config.yaml): `random` or `sequential`. The role fails on any other value.
#
# `random` is the default because ACL `hosts:` aliases and grants point at
# IPs. With `sequential`, Headscale hands the IP of a deleted node to the next
# node that joins, and that node inherits every grant the old IP had.
# Existing nodes keep their addresses when you change this: Headscale reads
# every assigned IP from the database as "used" and only asks the strategy for
# the next free one.
#
# With `random`, a fresh control host no longer gets 100.64.0.1, which is the
# default of `headscale_server_tailnet_ip`. After its first registration, read
# its IP with `bay gateway nodes`, set `headscale_server_tailnet_ip` and deploy
# again (tailscale_register stops the run with that message). Set
# `sequential` to keep the old behaviour.
headscale_ip_allocation: random
headscale_oidc_issuer: ""
headscale_oidc_client_id: ""
headscale_oidc_client_secret: ""

# ── OIDC enrolment allowlist ────────────────────────────────────────────────
# Headscale applies NO allowlist of its own. With `headscale_oidc_issuer` set
# and all three lists empty, ANY account the issuer will authenticate can
# enrol a node — with a public issuer (Google, GitHub) that is the whole
# internet. `bay validate` therefore FAILS when the issuer is set and all
# three lists are empty. Set at least one.
#
#   headscale_oidc_allowed_domains: ["example.com"]   # email domain suffix
#   headscale_oidc_allowed_users: ["ops@example.com"] # exact email addresses
#   headscale_oidc_allowed_groups: ["engineering"]    # IdP group claim values
#
# Each list renders into the `oidc:` block of config.yaml only when non-empty.
# Pair this with `headscale_acl_policy` below: an allowlist decides WHO may
# enrol, an ACL decides what an enrolled node may reach. `bay validate`
# warns when OIDC is on and no ACL policy is defined.
headscale_oidc_allowed_domains: []
headscale_oidc_allowed_users: []
headscale_oidc_allowed_groups: []
# Headscale user that owns VPS server nodes. Defaults to stack_name so each
# Bay project gets its own isolated user when sharing a Headscale server.
# Override in group_vars if you need a custom user name.
headscale_server_user: "{{ stack_name }}"

# ── ACL policy (file mode) ───────────────────────────────────────────────────
# UNDEFINED by default → no `policy:` block is rendered and no policy.hujson is
# written → Headscale stays in its default ALLOW-ALL mode (every tailnet node can
# reach every node/port). Defining this var renders an ACL policy and switches the
# whole tailnet to DEFAULT-DENY.
#
# !! BLAST RADIUS !! The moment a policy exists, anything NOT explicitly accepted
# is blocked. You MUST enumerate every required flow (cross-region service links,
# rig/monitoring, operator SSH, per-peer SSH, control/DNS) or you will break
# production tailnet traffic. Validate the rendered HuJSON and stage + cut over
# deliberately with a rollback (revert this var → redeploy --tags headscale).
#
# Shape: a HuJSON policy as a YAML dict (serialized to JSON by policy.hujson.j2):
#   headscale_acl_policy:
#     hosts:
#       infra: 100.64.0.5/32
#       laptop: 100.64.0.3/32
#     acls:
#       - action: accept
#         src: ["infra"]
#         dst: ["laptop:8787"]   # homelab-app ingress — infra-only
# See docs/tailnet-ingress.md. Left undefined here — opt in per consumer.
