---
# Container lifecycle orchestration (server-side reconciler).
#
# build_specs derives the desired container set from services.yml + infra
# vars; the bay_reconcile engine then observes actual state and reconciles
# in ONE server-side pass: create / recreate / canary-swap (zero-downtime
# services) / orphan-removal, in dependency order (infra → accessory →
# service). The per-container Ansible deploy loops (deploy_infra / _accessory
# / _service + the _prepare and cleanup helpers) were retired once
# the reconciler soaked clean in production — git history (≤ v0.96.2) holds
# the old per-container path if it is ever needed.
#
# Input: container_specs (list of container spec dicts). If not provided,
#        auto-builds from active_services / active_accessories.
#
#        container_lifecycle_only (optional list of container names). When
#        set, the full spec set is still built, so a container's spec has ONE
#        definition, but only the named containers are reconciled and
#        `container_specs` is NOT set, so a later full run in the same play
#        still builds its own. Callers must also pass
#        bay_reconciler_remove_orphans: false, because a partial bundle does
#        not list every managed container. git_deploy uses this to bring the
#        webhook receiver onto its current image.

- name: Build container specs from services.yml
  ansible.builtin.include_tasks: build_specs.yml
  when: container_specs is not defined or (container_lifecycle_only | default([]) | length > 0)

- name: Reconcile via server-side reconciler
  ansible.builtin.include_tasks: reconcile.yml
  vars:
    _reconcile_specs: >-
      {{ _container_lifecycle_partial_specs | default([])
         if (container_lifecycle_only | default([]) | length > 0)
         else container_specs }}
