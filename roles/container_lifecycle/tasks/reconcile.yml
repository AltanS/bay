---
# Server-side reconciler. The sole container-deploy path.
#
# Runs inside the container_lifecycle role (so its role-local filters are
# loaded) AFTER build_specs has produced container_specs. Renders a desired-
# state bundle from container_specs + the env files deploy_stack rendered,
# ships the self-contained bay_reconcile package, and runs it in ONE
# server-side pass — replacing the per-container Ansible deploy round-trips.
#
# Safety: orphan removal follows the long-standing container_lifecycle_cleanup
# knob (default true — parity with the retired cleanup.yml), overridable via
# bay_reconciler_remove_orphans; --plan-only mode (bay_reconciler_plan_only)
# reports the plan without mutating anything. A bundle that does not enumerate
# every managed container must never remove one — see planner.plan(). The
# bundle holds resolved env (secrets) at mode 0600 on
# the host — same posture as the env files — and is removed after the run.

# One read for every env file, instead of one slurp per container. The digest
# formula is unchanged (sha256 over the file's bytes), so an unchanged fleet
# keeps its config_hash and nothing recreates on upgrade.
#
# `check_mode: false` because this is a pure read that the bundle build below
# cannot proceed without — and because a check-mode-skipped command registers
# rc 0 with an empty stdout, which would make `from_json` blow up the play.
# argv (not cmd) so no path is ever shell-split; the path list travels as one
# JSON argument.
#
# A missing file is COLLECTED, not raised. The task is `no_log` because the
# output carries every secret in the fleet, and no_log swallows the traceback
# too — an env file that deploy_stack never rendered used to fail this task
# with nothing on screen but "MODULE FAILURE". The paths come back in their
# own key so the assert below can name them without printing a byte of
# content.
- name: Read the rendered env files in one pass
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import base64, json, sys
        paths = json.loads(sys.argv[1])
        out = {}
        missing = []
        for path in paths:
            try:
                with open(path, "rb") as handle:
                    out[path] = base64.b64encode(handle.read()).decode("ascii")
            except OSError:
                missing.append(path)
        print(json.dumps({"files": out, "missing": missing}))
      - >-
        {{ container_specs | selectattr('env_file', 'defined')
           | map(attribute='env_file') | list | to_json }}
  register: _reconcile_env_read
  changed_when: false
  check_mode: false
  no_log: true

- name: Fail with the list of env files that could not be read
  ansible.builtin.assert:
    that: _reconcile_env_missing | length == 0
    fail_msg: >-
      the reconciler could not read {{ _reconcile_env_missing | length }}
      rendered env file(s): {{ _reconcile_env_missing | join(', ') }}.
      deploy_stack renders these; a missing one usually means the play was run
      with a tag selection that skipped it. Re-run without --tags, or with
      --tags deploy_stack.
    quiet: true
  vars:
    _reconcile_env_missing: >-
      {{ (_reconcile_env_read.stdout | default('{}') | from_json)
         .get('missing', []) }}

- name: Build reconcile bundle entries
  ansible.builtin.set_fact:
    _reconcile_entries: "{{ (_reconcile_entries | default([])) + [_entry] }}"
  loop: "{{ container_specs }}"
  loop_control:
    loop_var: _spec
    label: "{{ _spec.name }}"
  vars:
    _env_map: >-
      {{ (_reconcile_env_read.stdout | default('{}') | from_json)
         .get('files', {}) }}
    _env_b64: >-
      {{ _env_map[_spec.env_file] if (_spec.env_file is defined
         and _spec.env_file in _env_map) else '' }}
    _env_file_dict: "{{ (_env_b64 | b64decode | parse_env_file) if _env_b64 else {} }}"
    _env_digest: "{{ (_env_b64 | b64decode | hash('sha256')) if _env_b64 else '' }}"
    _entry: >-
      {{ {
        'name': _spec.name,
        'image': _spec.image,
        'type': _spec.type,
        'config_hash': (_spec | bay_spec_hash(env_digest=_env_digest)),
        'env': (_env_file_dict | combine(_spec.env | default({}))),
        'volumes': _spec.volumes | default([]),
        'networks': _spec.networks | default([]),
        'network_mode': _spec.network_mode | default(None),
        'ports': _spec.ports | default([]),
        'command': _spec.command | default(None),
        'user': _spec.user | default(None),
        'restart_policy': _spec.restart_policy | default('unless-stopped'),
        'mem_limit': _spec.mem_limit | default(None),
        'labels': _spec.labels | default({}),
        'healthcheck': _spec.healthcheck | default(None),
        'log_driver': _spec.log_driver | default(None),
        'log_options': _spec.log_options | default(None),
        'zero_downtime': _spec.zero_downtime | default(false),
        'build': _spec.build | default(false)
      } }}
  no_log: true

- name: Write reconcile bundle (resolved env — mode 0600, removed after run)
  ansible.builtin.copy:
    dest: "{{ stack_dir }}/.reconcile-bundle.json"
    content: >-
      {{ {
        'stack': stack_name | default('bay'),
        'managed_label': container_lifecycle_managed_label | default('bay.managed'),
        'remove_orphans': bay_reconciler_remove_orphans | default(container_lifecycle_cleanup | default(true)) | bool,
        'containers': _reconcile_entries | default([])
      } | to_nice_json }}
    owner: "{{ app_user }}"
    group: docker
    mode: "0600"
  no_log: true

# ── shipping the package ────────────────────────────────────────────────
# This used to be a recursive `copy` of src/bay_reconcile on every deploy —
# every file re-transferred every run, `__pycache__` included. Now the package
# is packed once into a tar (pycache excluded) and shipped only when the
# marker on the host disagrees with the framework version + a digest of the
# package contents. A matching marker skips the transfer entirely.
#
# Consequence worth knowing: a hand-edited .reconcile/ tree is NOT repaired
# until the marker moves. `rm <stack_dir>/.reconcile/.version` forces a reship.

- name: Compute the reconciler package marker
  vars:
    # fileglob returns files only, so __pycache__/ never enters the digest.
    _pkg_files: >-
      {{ query('ansible.builtin.fileglob', playbook_dir ~ '/src/bay_reconcile/*')
         | sort }}
  ansible.builtin.set_fact:
    _reconcile_pkg_marker: >-
      {{ (bay_version | default('dev')) ~ ' ' ~
         (((_pkg_files | map('basename') | list)
           ~ query('ansible.builtin.file', *_pkg_files))
          | string | hash('sha256')) }}

- name: Read the reconciler marker on the host
  ansible.builtin.command:
    argv:
      - cat
      - "{{ stack_dir }}/.reconcile/.version"
  register: _reconcile_marker_on_host
  changed_when: false
  failed_when: false
  check_mode: false

- name: Ship the bay_reconcile package
  when: >-
    (_reconcile_marker_on_host.stdout | default('') | trim)
    != (_reconcile_pkg_marker | trim)
  vars:
    _pkg_cache: >-
      {{ lookup('ansible.builtin.env', 'XDG_CACHE_HOME')
         | default(lookup('ansible.builtin.env', 'HOME') ~ '/.cache', true) }}/bay
    _pkg_tar: >-
      {{ _pkg_cache }}/bay_reconcile-{{ _reconcile_pkg_marker | hash('sha1') }}.tar.gz
  block:
    # Both controller-side steps run in check mode. They touch a cache
    # directory under the operator's own HOME, never a managed host, and the
    # `unarchive` below cannot even be simulated without the tar: a
    # check-mode-SKIPPED pack left `--check` failing on a missing file, which
    # is the worst kind of dry-run result — one that says the change is broken
    # when only the dry run is. `changed_when: false` for the same reason:
    # filling a local cache is not a change to the host being reported on.
    - name: Ensure the controller-side package cache exists
      ansible.builtin.file:
        path: "{{ _pkg_cache }}"
        state: directory
        mode: "0700"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false

    # `creates:` makes this a no-op once the tar for this exact marker exists,
    # so a multi-host deploy packs once and ships N times.
    - name: Pack bay_reconcile without __pycache__
      ansible.builtin.command:
        argv:
          - tar
          - --exclude=__pycache__
          - --exclude=*.pyc
          - -czf
          - "{{ _pkg_tar }}"
          - -C
          - "{{ playbook_dir }}/src"
          - bay_reconcile
        creates: "{{ _pkg_tar }}"
      delegate_to: localhost
      become: false
      check_mode: false
      changed_when: false

    - name: Ensure the reconciler directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/.reconcile"
        state: directory
        owner: "{{ app_user }}"
        group: docker
        mode: "0750"

    - name: Unpack bay_reconcile on the host
      ansible.builtin.unarchive:
        src: "{{ _pkg_tar }}"
        dest: "{{ stack_dir }}/.reconcile/"
        owner: "{{ app_user }}"
        group: docker

    # Written LAST: if anything above fails the marker keeps its old value and
    # the next deploy retries the ship.
    - name: Record the shipped reconciler marker
      ansible.builtin.copy:
        content: "{{ _reconcile_pkg_marker | trim }}\n"
        dest: "{{ stack_dir }}/.reconcile/.version"
        owner: "{{ app_user }}"
        group: docker
        mode: "0640"

- name: Run server-side reconciler
  ansible.builtin.command:
    cmd: >-
      python3 -m bay_reconcile {{ stack_dir }}/.reconcile-bundle.json
      {{ '--plan-only' if (bay_reconciler_plan_only | default(false) | bool) else '' }}
  environment:
    PYTHONPATH: "{{ stack_dir }}/.reconcile"
  register: _reconcile_result
  changed_when: "(_reconcile_result.stdout | from_json).changed | default(false)"
  failed_when: _reconcile_result.rc != 0

# In --check mode the command task above is skipped, so `stdout` is empty and
# `from_json` raises (exit 2, the whole play dies). Guard on `is not skipped`,
# NOT on `rc is defined` — a check-mode-skipped command still registers rc: 0,
# so an `rc`-based guard passes and the crash happens anyway.
- name: Reconciler report
  ansible.builtin.debug:
    msg: "{{ _reconcile_result.stdout | from_json }}"
  when: _reconcile_result is not skipped

- name: Remove reconcile bundle (contains resolved env)
  ansible.builtin.file:
    path: "{{ stack_dir }}/.reconcile-bundle.json"
    state: absent
