---
# Container lifecycle defaults

# See roles/alert_channel/defaults/main.yml. Duplicated because this role
# does not depend on alert_channel; the copies are asserted equal in CI.
bay_host_label: ""
bay_alert_host: "{% set _n = (bay_host_label | default('', true)) or (ansible_hostname | default('', true)) or inventory_hostname %}{{ _n }}{% if _n != inventory_hostname %} ({{ inventory_hostname }}){% endif %}"

# The three values below reach the reconciler through the bundle that
# tasks/reconcile.yml writes, so a consumer can override them in group_vars.
# Until 0.7.3 they were ignored and the reconciler used its own built-in
# defaults. Each default here equals that built-in value.

# How long to wait for a canary container to become healthy (seconds)
container_lifecycle_healthcheck_timeout: 120

# How often to poll canary health status (seconds). This is only how fast Bay
# notices a healthy canary, not a safety limit; the timeout above is the limit.
# The value is 1 to match the reconciler's live default, which was chosen on
# purpose (a54b50d). The old value 5 was never applied, and would add up to 5
# seconds to every canary swap if it were.
container_lifecycle_healthcheck_poll: 1

# Grace period for the stop signal before SIGKILL when stopping containers
# (seconds). Docker waits this long for the process to exit on its own.
container_lifecycle_stop_timeout: 30

# How long a `release` one-shot (bay.toml `release`) may run before the deploy
# of that container fails (seconds). The old container keeps serving. The
# webhook rebuild script reads the same name (roles/git_deploy/defaults).
bay_release_timeout: 600

# How long `bay up` and `bay rollback` wait for a running webhook build before
# they skip a code move (seconds). bay_reconcile.codepin takes rebuild.sh's
# build lock (git_deploy_build_lock_path) before it moves `:latest`. On a
# timeout `:latest` stays, the move is `skipped` (`build running`) and bay up
# notes the container as kept. The same bound as the deploy's wait for backups.
container_lifecycle_build_lock_wait: 300

# Suffix appended to canary containers during zero-downtime deploy
container_lifecycle_canary_suffix: "-new"

# Labels applied to all managed containers
container_lifecycle_managed_label: "bay.managed"
container_lifecycle_stack_label: "bay.stack"

# Remove containers not in current specs after deploy
container_lifecycle_cleanup: true
