---
- name: reload systemd
  ansible.builtin.systemd:
    daemon_reload: true
  become_user: root

# Fires when image-map.json or config.json content changes (see
# tasks/render_image_map.yml and tasks/render_webhook.yml). The webhook
# receiver loads /config/image-map.json and /config/config.json once at
# process start (files/webhook/app.py:_load_image_map and _load_config, called
# from main()), so a fresh render on disk has no effect until the container
# restarts. Without this handler,
# new services added to services.yml would not be expanded into per-service
# pull triggers by the receiver — see issue #13.
#
# Idempotence: Ansible's template task only reports `changed` when content
# differs, so this handler only runs when one of the two files changed.
#
# A restart is enough here: it re-reads the bind-mounted files, and the image
# is already current. In a full deploy webhook.yml reconciles the receiver
# (recreate on image drift) before handlers run; when that reconcile just
# recreated the container it read the new files already, so the restart is
# skipped. Under `bay up` (deploy_stack only) the deploy_stack container pass
# recreates the receiver on image, env or config drift (the spec label
# `com.bay.receiver-config-hash` hashes the two rendered files), so the plan
# predicts it, and deploy_stack sets `_bay_webhook_reconciled` from that pass:
# the restart is skipped there too. The handler stays as a safety net. A host
# with no receiver yet (fresh host, deploy_stack creates it) is not an error.
# In check mode the command is skipped.
#
# Container name `bay-webhook` is the framework-fixed identity used by
# roles/deploy_stack/templates/_webhook_receiver.j2 and
# roles/container_lifecycle/tasks/build_specs.yml (`_webhook_spec`) — not
# consumer-overridable.
- name: Restart bay-webhook
  ansible.builtin.command:
    cmd: docker restart bay-webhook
  register: _bay_webhook_restart
  changed_when: _bay_webhook_restart.rc == 0
  failed_when:
    - _bay_webhook_restart.rc != 0
    - "'No such container' not in _bay_webhook_restart.stderr"
  when: not (_bay_webhook_reconciled | default(false) | bool)
