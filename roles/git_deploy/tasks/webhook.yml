---
# Bring the webhook receiver container onto the current image (full deploy).
# Only runs when build services exist and webhook config is defined.
#
# The receiver's directories, HMAC key, config.json, files and image are in
# render_webhook.yml, which main.yml includes under deploy_stack too (so
# `bay up` registers a new build app). It runs before this file.

- name: Render image-to-services map for pull signal handler
  # Extracted to render_image_map.yml so it can also run under --tags
  # deploy_stack (issue #13). The include is idempotent — facts
  # already populated by main.yml are reused via `when: var is not defined`
  # guards in render_image_map.yml.
  ansible.builtin.include_tasks: render_image_map.yml

# Building the image (render_webhook.yml) does not change the running container: it keeps the image
# it was created from. Reconcile the receiver through the same spec and the
# same reconciler deploy_stack uses, so env, volumes, labels, user and
# networks stay identical and the next deploy_stack sees no drift. The
# reconciler compares the running container's image ID with the local
# `bay-webhook:latest` on EVERY run, so a receiver left stale by an earlier
# deploy heals here too, and a matching one is a NoOp (no restart).
#
# Only the receiver is in the bundle, so orphan removal is off.
#
# The receiver's env file is rendered by deploy_stack. A host that has not had
# a deploy_stack run yet has no container to fix, and deploy_stack creates the
# receiver on its first run, so skip instead of failing.
- name: Check that deploy_stack has rendered the webhook receiver env file
  ansible.builtin.stat:
    path: "{{ stack_dir }}/env/bay-webhook.env"
  register: _webhook_env_stat

- name: Bring the webhook receiver onto the current image
  ansible.builtin.include_role:
    name: container_lifecycle
  vars:
    container_lifecycle_only: [bay-webhook]
    bay_reconciler_remove_orphans: false
  when: _webhook_env_stat.stat.exists

# Tells the "Restart bay-webhook" handler that the receiver was just
# reconciled against the current image-map.json, so a restart would be a
# second, pointless one.
- name: Record whether the reconciler changed the webhook receiver
  ansible.builtin.set_fact:
    _bay_webhook_reconciled: >-
      {{ (_reconcile_result.stdout | default('{}') | from_json).changed | default(false)
         if (_reconcile_result is defined and _reconcile_result is not skipped
             and (_reconcile_result.stdout | default('')) | length > 0)
         else false }}
  when: _webhook_env_stat.stat.exists
