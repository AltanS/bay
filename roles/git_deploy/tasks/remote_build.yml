---
# Build and push Docker images for services using the remote strategy.
# Runs on the build server (delegate_to: build_server).
# Called with _svc_name as loop var.
#
# _pin_commit (optional, a full or short commit; empty or unset: none): the first image build of
# `bay up` (first_image_remote.yml, 2.27.0) sets it to the commit the fleet
# pins. After the fetch the checkout is reset to exactly that commit (the
# commit is fetched by itself when the branch fetch does not hold it), so the
# image is <repo>:<commit12> of the pin with that commit in com.bay.commit.
# Unset (the full `bay deploy` path): the head of the branch, as before.
#
# _fi_no_moving (optional, bool): the registry already holds the moving tag
# (_image_ref, usually :latest), so this is not a true first image. The build
# then pushes <repo>:<commit12> only and never moves the moving tag. Unset or
# false: both tags, as before.

- name: "{{ _svc_name }} — Resolve remote build config"
  ansible.builtin.set_fact:
    _build: "{{ services[_svc_name].build }}"
    _image_ref: "{{ services[_svc_name].image }}"
    _image_repo: "{{ services[_svc_name].image | regex_replace(':.*$', '') }}"
    _branch: "{{ services[_svc_name].build.branch | default('main') }}"
    _dockerfile: "{{ services[_svc_name].build.dockerfile | default('Dockerfile') }}"
    _context: "{{ services[_svc_name].build.context | default('.') }}"
    _remote_clone_dir: "{{ git_deploy_remote_build_dir }}/{{ _svc_name }}"
    _remote_askpass: "{{ git_deploy_remote_build_dir }}/.git-askpass-{{ _svc_name }}"

- name: "{{ _svc_name }} — Ensure remote clone directory exists"
  ansible.builtin.file:
    path: "{{ _remote_clone_dir }}"
    state: directory
    # 0700: the checkout holds application source and, historically, a PAT in
    # .git/config.
    mode: "0700"
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

# The PAT reaches git through GIT_ASKPASS, never through the URL — see
# templates/git-askpass.sh.j2.
- name: "{{ _svc_name }} — Install git credential helper on build server"
  ansible.builtin.template:
    src: git-askpass.sh.j2
    dest: "{{ _remote_askpass }}"
    owner: "{{ app_user }}"
    mode: "0700"
  vars:
    _askpass_token: "{{ _build.token }}"
  when: _build.token is defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true

- name: "{{ _svc_name }} — Check if repo already cloned on build server"
  ansible.builtin.stat:
    path: "{{ _remote_clone_dir }}/repo/.git"
  register: _remote_repo_stat
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Clone repository on build server"
  ansible.builtin.command:
    cmd: >-
      git clone --branch {{ _branch }} --single-branch
      {{ _build.repo | bay_token_url(_build.token) }}
      {{ _remote_clone_dir }}/repo
  environment:
    GIT_ASKPASS: "{{ _remote_askpass }}"
    GIT_TERMINAL_PROMPT: "0"
  when:
    - not _remote_repo_stat.stat.exists
    - _build.token is defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true

- name: "{{ _svc_name }} — Clone repository on build server (SSH)"
  ansible.builtin.command:
    cmd: >-
      git clone --branch {{ _branch }} --single-branch
      {{ _build.repo }}
      {{ _remote_clone_dir }}/repo
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when:
    - not _remote_repo_stat.stat.exists
    - _build.token is not defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Refresh remote.origin.url with current token"
  ansible.builtin.command:
    cmd: git remote set-url origin {{ _build.repo | bay_token_url(_build.token) }}
    chdir: "{{ _remote_clone_dir }}/repo"
  when:
    - _remote_repo_stat.stat.exists
    - _build.token is defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true
  changed_when: false

- name: "{{ _svc_name }} — Fetch latest changes"
  ansible.builtin.command:
    cmd: >-
      git -c url.{{ _build.repo | bay_token_url(_build.token) }}.insteadOf={{ _build.repo }}
      fetch origin {{ _branch }}
    chdir: "{{ _remote_clone_dir }}/repo"
  environment:
    GIT_ASKPASS: "{{ _remote_askpass }}"
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _remote_repo_stat.stat.exists
    - _build.token is defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true

- name: "{{ _svc_name }} — Fetch latest changes (SSH)"
  ansible.builtin.command:
    cmd: git fetch origin {{ _branch }}
    chdir: "{{ _remote_clone_dir }}/repo"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _remote_repo_stat.stat.exists
    - _build.token is not defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Reset to fetched HEAD (force-push safe)"
  ansible.builtin.command:
    cmd: git reset --hard FETCH_HEAD
    chdir: "{{ _remote_clone_dir }}/repo"
  when: _remote_repo_stat.stat.exists
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

# ── Commit pin (bay up first image, 2.27.0) ─────────────────────────────
- name: "{{ _svc_name }} — Check the pinned commit"
  ansible.builtin.assert:
    that:
      - _pin_commit is string
      - _pin_commit is match('^[0-9a-f]{7,40}$')
    fail_msg: "{{ _svc_name }}: the pinned commit '{{ _pin_commit }}' is not a commit id"
    quiet: true
  when: _pin_commit | default('') | length > 0

- name: "{{ _svc_name }} — Look for the pinned commit in the checkout"
  ansible.builtin.command:
    cmd: git cat-file -e {{ _pin_commit }}^{commit}
    chdir: "{{ _remote_clone_dir }}/repo"
  register: _pin_present
  failed_when: false
  changed_when: false
  when: _pin_commit | default('') | length > 0
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Fetch the pinned commit"
  ansible.builtin.command:
    cmd: >-
      git -c url.{{ _build.repo | bay_token_url(_build.token) }}.insteadOf={{ _build.repo }}
      fetch origin {{ _pin_commit }}
    chdir: "{{ _remote_clone_dir }}/repo"
  environment:
    GIT_ASKPASS: "{{ _remote_askpass }}"
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _pin_commit | default('') | length > 0
    - _pin_present.rc != 0
    - _build.token is defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  no_log: true

- name: "{{ _svc_name }} — Fetch the pinned commit (SSH)"
  ansible.builtin.command:
    cmd: git fetch origin {{ _pin_commit }}
    chdir: "{{ _remote_clone_dir }}/repo"
  environment:
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _pin_commit | default('') | length > 0
    - _pin_present.rc != 0
    - _build.token is not defined
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Reset to the pinned commit"
  ansible.builtin.command:
    cmd: git reset --hard {{ _pin_commit }}
    chdir: "{{ _remote_clone_dir }}/repo"
  when: _pin_commit | default('') | length > 0
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Get current commit SHA"
  ansible.builtin.command:
    cmd: git rev-parse --short=12 HEAD
    chdir: "{{ _remote_clone_dir }}/repo"
  register: _remote_sha
  changed_when: false
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Check if image already in registry"
  ansible.builtin.command:
    cmd: "docker manifest inspect {{ _image_repo }}:{{ _remote_sha.stdout }}"
  register: _remote_image_exists
  failed_when: false
  changed_when: false
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"

- name: "{{ _svc_name }} — Build and push image"
  when: _remote_image_exists.rc != 0
  delegate_to: "{{ build_server }}"
  become: true
  become_user: "{{ app_user }}"
  block:
    # The same helper rebuild.sh calls (templates/select-builder.sh.j2). It
    # prints the remote builder when its probe answers and the local one
    # otherwise, and always exits 0. No retry here: a failed deploy-time
    # build is in front of the operator already.
    - name: "{{ _svc_name }} — Select buildx builder"
      ansible.builtin.command:
        cmd: "{{ stack_dir }}/bin/select-builder.sh"
      register: _selected_builder
      changed_when: false

    - name: "{{ _svc_name }} — Report selected builder"
      ansible.builtin.debug:
        msg: "builder={{ _selected_builder.stdout | trim }} ({{ _selected_builder.stderr | trim }})"

    - name: "{{ _svc_name }} — Ensure secrets directory exists"
      ansible.builtin.file:
        path: "{{ git_deploy_remote_build_dir }}/.secrets"
        state: directory
        mode: "0700"
      when: (_build.secrets | default({})) | length > 0

    - name: "{{ _svc_name }} — Write build secrets to temp files"
      ansible.builtin.copy:
        content: "{{ item.value }}"
        dest: "{{ git_deploy_remote_build_dir }}/.secrets/{{ _svc_name }}-{{ item.key }}"
        mode: "0600"
      loop: "{{ _build.secrets | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

    - name: "{{ _svc_name }} — Build and push Docker image on build server"
      # buildx exports both tags straight to the registry in one pass. The
      # image is deliberately NOT loaded into the build server's local daemon
      # — the registry is the source of truth and a local export doubles the
      # cost of every build.
      ansible.builtin.command:
        cmd: >-
          docker buildx build
          --builder {{ _selected_builder.stdout | trim | default(bay_buildx_builder, true) }}
          --provenance=false
          --push
          {% if git_deploy_registry_cache | default(false) %}
          --cache-from type=registry,ref={{ _image_repo }}:buildcache
          --cache-to type=registry,ref={{ _image_repo }}:buildcache,mode=max
          {% endif %}
          -t {{ _image_repo }}:{{ _remote_sha.stdout }}
          {% if (_fi_no_moving | default(false) | string | lower) not in ['true', 'yes', '1'] %}
          -t {{ _image_ref }}
          {% endif %}
          --label org.opencontainers.image.revision={{ _remote_sha.stdout }}
          --label com.bay.commit={{ _remote_sha.stdout }}
          -f {{ _dockerfile }}
          {% for key, value in (_build.args | default({})).items() %}
          --build-arg {{ key }}={{ value }}
          {% endfor %}
          {% for key in (_build.secrets | default({})).keys() %}
          --secret id={{ key }},src={{ git_deploy_remote_build_dir }}/.secrets/{{ _svc_name }}-{{ key }}
          {% endfor %}
          {{ _context }}
        chdir: "{{ _remote_clone_dir }}/repo"

  always:
    - name: "{{ _svc_name }} — Clean up build secret temp files"
      ansible.builtin.file:
        path: "{{ git_deploy_remote_build_dir }}/.secrets/{{ _svc_name }}-{{ item.key }}"
        state: absent
      loop: "{{ _build.secrets | default({}) | dict2items }}"
      loop_control:
        label: "{{ item.key }}"
      no_log: true

- name: "{{ _svc_name }} — Image already at {{ _remote_sha.stdout }}"
  ansible.builtin.debug:
    msg: "Image {{ _image_repo }}:{{ _remote_sha.stdout }} already in registry, skipping build"
  when: _remote_image_exists.rc == 0

- name: "{{ _svc_name }} — Prune old local content-hash tags"
  ansible.builtin.include_tasks: cleanup_local_images.yml
  when: (git_deploy_build_keep_tags | int) > 0
