---
# Clone or pull a shared repo for a group of services.
# Called with _repo_group as loop var (from bay_repo_groups filter).
# Deduplicates: N services sharing (repo, branch) = 1 clone + 1 pull.

- name: "{{ _repo_group.slug }} — Resolve credential helper path"
  ansible.builtin.set_fact:
    _repo_group_askpass: "{{ git_deploy_build_dir }}/.git-askpass-{{ _repo_group.slug }}"

- name: "{{ _repo_group.slug }} — Ensure shared repo directory exists"
  ansible.builtin.file:
    path: "{{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}"
    state: directory
    owner: "{{ app_user }}"
    # 0700, not 0755 — .git/config used to hold a PAT (see git-askpass.sh.j2).
    mode: "0700"

# ── Token authentication ────────────────────────────────────────────────────
# The PAT reaches git through GIT_ASKPASS, never through the URL. See the
# helper template for what that buys.
- name: "{{ _repo_group.slug }} — Install git credential helper (token)"
  ansible.builtin.template:
    src: git-askpass.sh.j2
    dest: "{{ _repo_group_askpass }}"
    owner: "{{ app_user }}"
    mode: "0700"
  vars:
    _askpass_token: "{{ _repo_group.token }}"
  when: _repo_group.has_token
  no_log: true

- name: "{{ _repo_group.slug }} — Check if repo already cloned"
  ansible.builtin.stat:
    path: "{{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo/.git"
  register: _shared_repo_stat

- name: "{{ _repo_group.slug }} — Clone repository (token)"
  ansible.builtin.command:
    cmd: >-
      git clone --branch {{ _repo_group.branch }} --single-branch
      {{ _repo_group.clone_url }}
      {{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo
  environment:
    GIT_ASKPASS: "{{ _repo_group_askpass }}"
    GIT_TERMINAL_PROMPT: "0"
  when:
    - not _shared_repo_stat.stat.exists
    - _repo_group.has_token
  no_log: true

- name: "{{ _repo_group.slug }} — Clone repository (deploy key)"
  ansible.builtin.command:
    cmd: >-
      git clone --branch {{ _repo_group.branch }} --single-branch
      {{ _repo_group.repo }}
      {{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo
  environment:
    GIT_SSH_COMMAND: >-
      ssh -i {{ git_deploy_build_dir }}/{{ _repo_group.auth_svc }}/.deploy_key
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ git_deploy_known_hosts }}
    GIT_TERMINAL_PROMPT: "0"
  when:
    - not _shared_repo_stat.stat.exists
    - not _repo_group.has_token

# Also the migration path off the old token URLs: an existing checkout keeps a
# PAT in .git/config until this rewrites origin to the plain HTTPS form.
- name: "{{ _repo_group.slug }} — Refresh remote.origin.url"
  ansible.builtin.command:
    cmd: git remote set-url origin {{ _repo_group.clone_url }}
    chdir: "{{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo"
  when:
    - _shared_repo_stat.stat.exists
    - _repo_group.has_token
  no_log: true
  changed_when: false

- name: "{{ _repo_group.slug }} — Pull latest changes (token)"
  ansible.builtin.command:
    cmd: >-
      git -c url.{{ _repo_group.clone_url }}.insteadOf={{ _repo_group.repo }}
      pull origin {{ _repo_group.branch }}
    chdir: "{{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo"
  environment:
    GIT_ASKPASS: "{{ _repo_group_askpass }}"
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _shared_repo_stat.stat.exists
    - _repo_group.has_token
  no_log: true

- name: "{{ _repo_group.slug }} — Pull latest changes (deploy key)"
  ansible.builtin.command:
    cmd: git pull origin {{ _repo_group.branch }}
    chdir: "{{ git_deploy_build_dir }}/shared/{{ _repo_group.slug }}/repo"
  environment:
    GIT_SSH_COMMAND: >-
      ssh -i {{ git_deploy_build_dir }}/{{ _repo_group.auth_svc }}/.deploy_key
      -o StrictHostKeyChecking=yes
      -o UserKnownHostsFile={{ git_deploy_known_hosts }}
    GIT_TERMINAL_PROMPT: "0"
  when:
    - _shared_repo_stat.stat.exists
    - not _repo_group.has_token
