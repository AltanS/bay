---
# The webhook receiver's files and image, under the deploy_stack tag too.
#
# `bay up` runs `--tags deploy_stack` only. Before 2.2.0 the receiver config,
# its image and its directories came only from webhook.yml, which main.yml
# includes with no tags from blocks that need untagged facts. So a new build
# app got a container from `bay up` but no entry in the receiver's
# config.json: its pushes were answered 404 until a full `bay deploy`.
#
# Same approach as render_image_map.yml and render_rebuild_script.yml: this
# file resolves the facts it reads (through render_image_map.yml, guarded),
# and renders only under the same `when` as the image-map render.
#
# What this file does NOT do: the receiver-only reconcile. That stays in
# webhook.yml, on the full-deploy path. Under `bay up` the deploy_stack
# container pass creates or recreates `bay-webhook` itself: it compares the
# running image ID with `bay-webhook:latest`, and a new build service changes
# the receiver's SERVICE_BRANCHES env.
#
# The receiver reads config.json once, at start (app.py `_load_config`), from
# a single-file bind mount. So the render notifies `Restart bay-webhook`. The
# handler runs at the end of the play, after deploy_stack, and tolerates a
# box that has no receiver yet.

- name: Render receiver — resolve the build facts when run on its own
  ansible.builtin.include_tasks: render_image_map.yml
  when: >-
    _is_build_server is not defined
    or _all_build_services is not defined
    or git_deploy_rebuild_services is not defined

- name: Render the webhook receiver (runs under deploy_stack too)
  when:
    - webhook is defined
    - git_deploy_rebuild_services | default([]) | length > 0
    - (_all_build_services | default([]) | length > 0)
      or (_is_build_server | bool and (_global_remote_build_services | default([]) | length > 0))
  block:
    # ── Shared build-control group ──────────────────────────────────────
    # triggers/ and state/ have two writers with different UIDs: app_user (via
    # the bay-build@.path unit, which runs rebuild.sh) and the webhook
    # container. They used to be 0777 to make that work, which meant ANY
    # local user could drop a .trigger file and force a rebuild and restart
    # of any service, or rewrite the circuit-breaker state to suppress or
    # trip the breaker.
    #
    # The fix is a shared group, not a permissive mode. The GID is fixed
    # rather than allocated because the container cannot resolve a host group
    # name: it is started as "<uid>:{{ git_deploy_build_gid }}" so the GID is
    # its primary group inside the container too.
    - name: Ensure the shared build-control group exists
      ansible.builtin.group:
        name: "{{ git_deploy_build_group }}"
        gid: "{{ git_deploy_build_gid }}"
        state: present
      become: true
      become_user: root

    - name: Add app_user to the shared build-control group
      ansible.builtin.user:
        name: "{{ app_user }}"
        groups: "{{ git_deploy_build_group }}"
        append: true
      become: true
      become_user: root

    # 2770: owner + group write, setgid so every file the webhook container
    # or rebuild.sh creates inherits the shared group, and nothing for
    # "other".
    - name: Ensure triggers directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/triggers"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ git_deploy_build_group }}"
        mode: "2770"
      become: true
      become_user: root

    - name: Ensure state directory exists
      # Shared between rebuild.sh (writes CB state files) and the webhook
      # container (writes telegram-failures.log).
      ansible.builtin.file:
        path: "{{ stack_dir }}/state"
        state: directory
        owner: "{{ app_user }}"
        group: "{{ git_deploy_build_group }}"
        mode: "2770"
      become: true
      become_user: root

    # One-off migration off 0777. setgid only governs NEW files, so anything
    # written under the old mode (circuit-breaker state,
    # telegram-failures.log) still carries its creator's group and no group
    # write bit, which would leave one of the two writers locked out of its
    # own file.
    - name: Re-group pre-existing state files
      ansible.builtin.file:
        path: "{{ stack_dir }}/state"
        state: directory
        group: "{{ git_deploy_build_group }}"
        mode: "g+w"
        recurse: true
      become: true
      become_user: root

    - name: Ensure webhook config directory exists
      ansible.builtin.file:
        path: "{{ stack_dir }}/webhook"
        state: directory
        mode: "0755"

    # rebuild.sh signs cross-region pull signals with this key. It reads it
    # via `openssl dgst -macopt hexkey:` so the secret is never an argv
    # element (it used to be passed as `-hmac '<secret>'`, visible in `ps` on
    # every rebuild). Hex-encoded because that is the only form -macopt
    # accepts.
    - name: Render webhook HMAC key file
      ansible.builtin.copy:
        content: "{{ webhook.secret | bay_hexkey }}"
        dest: "{{ stack_dir }}/webhook/hmac.key"
        owner: "{{ app_user }}"
        mode: "0600"
      no_log: true

    # The receiver reads this file once, at start. A change needs a restart.
    - name: Render webhook service config
      ansible.builtin.template:
        src: webhook-config.json.j2
        dest: "{{ stack_dir }}/webhook/config.json"
        mode: "0644"
      notify: Restart bay-webhook

    - name: Copy webhook receiver files
      ansible.builtin.copy:
        src: webhook/
        dest: "{{ git_deploy_build_dir }}/webhook/"
        mode: "0644"
      register: _webhook_files

    # The image can be missing while the files are unchanged (pruned, or a
    # host that has the files from an earlier deploy but never built). Build
    # then too. A first build app on a box needs the image here, before the
    # deploy_stack container pass creates `bay-webhook`.
    - name: Check whether the webhook receiver image exists
      ansible.builtin.command:
        cmd: docker image inspect bay-webhook:latest
      register: _webhook_image_inspect
      changed_when: false
      failed_when: false
      check_mode: false

    # Check mode skips a command and (ansible-core >= 2.19) still registers
    # rc 0, so the inspect result is read only when it really ran.
    - name: Build webhook receiver image
      ansible.builtin.command:
        cmd: "docker build -t bay-webhook:latest {{ git_deploy_build_dir }}/webhook/"
      when: >-
        _webhook_files.changed
        or (_webhook_image_inspect is not skipped and _webhook_image_inspect.rc != 0)
