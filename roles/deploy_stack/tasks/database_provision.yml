---
# Provision databases for services with a `database:` binding.
#
# One idempotent SQL script per accessory, piped into one psql. This used to
# be six looped tasks per binding (exists-check, create, exists-check, create
# role, grant, schema grant), so a fleet with N bindings paid 6N round trips
# every deploy. Idempotence now lives in the SQL (`pg_database` / `pg_roles`
# guards), which is where it belongs — the server already knows.
#
# Quoting contract: see the header of templates/provision-db.sql.j2. In short,
# no identifier is ever interpolated as an identifier; names cross as SQL
# string literals and `format('%I', ...)` makes them identifiers server-side.
# The schema pattern (^[a-z_][a-z0-9_]{0,62}$) and validate.py's identifier
# check are the earlier gates; this is the last one, and it does not depend on
# them, because roles get run straight from ansible-playbook in recovery.
#
# `argv:` (not `cmd:`) so the accessory name is never shlex-split, and the SQL
# travels on stdin rather than in argv, so it never reaches `ps`.
#
# `no_log: true` covers the whole task now: the script carries every bound
# role's password. To debug a failure, re-run with `-e provision_db_debug=true`
# — that flips no_log off and the SQL (passwords included) prints.

- name: Collect services with database bindings
  ansible.builtin.set_fact:
    _db_bindings: >-
      {{
        active_services | dict2items
        | selectattr('value.database', 'defined')
        | list
      }}

- name: Provision databases
  when: _db_bindings | length > 0
  block:
    - name: Collect the accessories those bindings target
      ansible.builtin.set_fact:
        _db_accessories: >-
          {{ _db_bindings
             | map(attribute='value.database.accessory')
             | unique | list }}

    # One `docker exec` per accessory. `-q` plus the script's
    # `\pset tuples_only` means the only thing on stdout is the script's own
    # "CHANGED:" lines, so `changed` is derived from real work rather than
    # asserted with `changed_when: true`.
    - name: Provision databases, roles and grants
      vars:
        _acc: "{{ item }}"
        _acc_bindings: >-
          {{ _db_bindings
             | selectattr('value.database.accessory', 'equalto', item)
             | list }}
      ansible.builtin.command:
        argv:
          - docker
          - exec
          - -i
          - "{{ _acc }}"
          - psql
          - -q
          - -U
          - "{{ (active_accessories[_acc].env['clear'].POSTGRES_USER) | default('postgres') }}"
        stdin: >-
          {{ lookup('ansible.builtin.template', 'provision-db.sql.j2',
                    template_vars={'_acc_bindings': _acc_bindings}) }}
      loop: "{{ _db_accessories }}"
      register: _db_provision
      changed_when: "'CHANGED:' in (_db_provision.stdout | default(''))"
      no_log: "{{ not (provision_db_debug | default(false) | bool) }}"
