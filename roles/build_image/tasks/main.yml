---
# Image pull for registry-based services and accessories.
# Services with build: blocks that use local strategy are handled by git_deploy.
# Remote-strategy services are skipped here — they are built on the build server,
# pushed to a registry, and then pulled in git_deploy after the push completes.
# This role pulls images for:
#   - Services with image: field (excludes build.strategy: remote)
#   - Accessories (always image-based)
# Runs as app user (become_user inherited from play; app user has docker group)

- name: Log in to Docker registries
  community.docker.docker_login:
    registry_url: "https://{{ item.domain }}"
    username: "{{ item.username }}"
    password: "{{ item.password }}"
  loop: "{{ docker_registries | default([]) }}"
  loop_control:
    label: "{{ item.domain }}"
  when: (item.username | default('')) | length > 0
  no_log: true

- name: Collect images produced by remote builds
  ansible.builtin.set_fact:
    _remote_built_images: >-
      {{
        (services | default({})) | dict2items
        | selectattr('value.build.strategy', 'defined')
        | selectattr('value.build.strategy', 'eq', 'remote')
        | selectattr('value.image', 'defined')
        | map(attribute='value.image')
        | list
        | unique
      }}

# One task, one SSH round trip, four pulls at a time. The image list is built
# controller-side from exactly the expressions the two former loops used, so
# selection is unchanged:
#   - services with an image:, minus any image produced by a remote build
#     (e.g. locale services sharing one remotely-built image) — git_deploy's
#     remote_build.yml builds, pushes, then pulls those post-push;
#   - every accessory image.
# Names are `quote`d and fed through printf, so they never hit the shell
# unquoted — the shell strips that quoting, so printf writes the raw name and
# one name per line reaches xargs. xargs is told `-d '\n'`: its DEFAULT input
# syntax has its own quote and backslash rules, so it would have re-parsed a
# name containing a quote or a space and split it back apart, undoing the
# protection one stage earlier. `-r` keeps an empty list from invoking the
# pull with no image at all. `set -o pipefail` is the house pattern and is safe HERE only
# because xargs is the last stage and reads its input to the end: the rc is
# the pull result either way. Never pair pipefail with a short-circuiting
# reader such as `grep -q` — the reader exits early, the writer takes SIGPIPE,
# and pipefail turns a successful command into rc 141 (shipped once already).
- name: Pull images
  vars:
    _pull_images: >-
      {{
        (
          (
            active_services | dict2items
            | selectattr('value.image', 'defined')
            | rejectattr('value.image', 'in', _remote_built_images)
            | map(attribute='value.image') | list
          )
          + (
            active_accessories | dict2items
            | map(attribute='value.image') | list
          )
        ) | unique
      }}
  ansible.builtin.shell:
    cmd: >-
      set -o pipefail;
      printf '%s\n' {{ _pull_images | map('quote') | join(' ') }}
      | xargs -r -d '\n' -P 4 -n 1 docker pull
    executable: /bin/bash
  register: _pull_result
  changed_when: "'Downloaded newer image' in (_pull_result.stdout | default(''))"
  retries: 3
  delay: 10
  until: _pull_result.rc == 0
  when: _pull_images | length > 0
