[defaults]
force_color = True
inventory = example/hosts
roles_path = vendor/roles:roles
# `collections_path`, NOT `collections_paths` — ansible-core 2.20 silently
# ignores the plural spelling, so the vendored/pinned collections were never
# on the search path and ansible quietly fell back to ~/.ansible/collections.
collections_path = vendor/collections
# No vault_password_file on purpose: this cfg is framework-local (note the
# example/ inventory) and the framework repo holds zero encrypted files, so
# pointing at a gitignored .vault_pass only made ansible abort in a fresh
# clone — which is what kept `make test`/`make lint` from ever running.
# Consumers get their own vault-configured ansible.cfg from
# src/bay_cli/wizard/templates/ansible_cfg.j2.

[ssh_connection]
ssh_args = -o ForwardAgent=yes -o ControlMaster=auto -o ControlPersist=60s
pipelining = True
retries = 1
